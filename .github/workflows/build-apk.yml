name: Build IranGram APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'app.html'
      - 'icon.svg'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate embedded app JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('app.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline application script found')
          Path('/tmp/iran-gram-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/iran-gram-inline.js
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IranGram-Android-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned release APK (not store-ready)
        uses: actions/upload-artifact@v4
        with:
          name: IranGram-Android-RELEASE-UNSIGNED
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
