name: Render browser smoke test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - '.github/workflows/render-smoke.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test live website and app
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            for (const [name, url] of [
              ['landing', 'https://iran-gram.onrender.com/'],
              ['app', 'https://iran-gram.onrender.com/app.html?v=b6d58914']
            ]) {
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              const response = await page.goto(url, { waitUntil: 'load', timeout: 30000 });
              if (!response || !response.ok()) throw new Error(name + ' HTTP response failed: ' + (response?.status() ?? 'none'));
              await page.waitForTimeout(1800);
              if (name === 'landing') {
                if (!(await page.title()).includes('ایرانگرام')) throw new Error('Landing title missing');
                if (!(await page.locator('a[href*="app.html"]').count())) throw new Error('App entry link missing');
              } else {
                const visible = await page.locator('#app').evaluate(el => {
                  const r = el.getBoundingClientRect();
                  return r.width > 0 && r.height > 0 && getComputedStyle(el).display !== 'none';
                });
                if (!visible) throw new Error('App interface is not visible');
                const splashVisible = await page.locator('#appSplash').evaluate(el => getComputedStyle(el).visibility !== 'hidden' && Number(getComputedStyle(el).opacity) > 0.05);
                if (splashVisible) throw new Error('Splash screen did not disappear');
              }
              if (name === 'app') {
                const html = await page.content();
                if (!html.includes('prepareIranGramAvatar') || !html.includes('collectionAvatarFile')) {
                  throw new Error('Live app is missing the group avatar fix');
                }
                const normalized = await page.evaluate(async () => {
                  const canvas = document.createElement('canvas');
                  canvas.width = 32; canvas.height = 24;
                  const ctx = canvas.getContext('2d');
                  ctx.fillStyle = '#168acd'; ctx.fillRect(0, 0, 32, 24);
                  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                  const input = new File([blob], 'smoke-test.png', { type: 'image/png' });
                  const output = await prepareIranGramAvatar(input, 128);
                  const bitmap = await createImageBitmap(output);
                  const result = { type: output.type, width: bitmap.width, height: bitmap.height, size: output.size };
                  bitmap.close();
                  return result;
                });
                if (normalized.type !== 'image/jpeg' || normalized.width !== 128 || normalized.height !== 128 || normalized.size < 1) {
                  throw new Error('Avatar normalization failed: ' + JSON.stringify(normalized));
                }
                console.log('PASS group avatar normalization ' + JSON.stringify(normalized));
              }
              if (errors.length) throw new Error(name + ' JavaScript errors: ' + errors.join(' | '));
              console.log('PASS ' + name + ' ' + response.status() + ' ' + url);
              await page.close();
            }
          } finally {
            await browser.close();
          }
          NODE
