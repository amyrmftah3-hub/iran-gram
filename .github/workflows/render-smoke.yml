name: GitHub Pages browser smoke test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - '.github/workflows/render-smoke.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages to publish IranGram 1.2.3
        run: |
          set -e
          pages_url="https://amyrmftah3-hub.github.io/iran-gram/?check=${GITHUB_SHA}"
          
          for attempt in $(seq 1 60); do
            pages="$(curl --max-time 10 -fsSL "$pages_url" || true)"
            
            if printf '%s' "$pages" | grep -Fq 'app.html?v=1.2.3'; then
              echo "PASS GitHub Pages published IranGram 1.2.3"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not publish the current app build in time" >&2
          exit 1
      - name: Test live website and media upload paths
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            for (const [name, url] of [
              ['landing-pages', 'https://amyrmftah3-hub.github.io/iran-gram/'],
              ['app-pages', 'https://amyrmftah3-hub.github.io/iran-gram/app.html?v=1.2.3']
            ]) {
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              const response = await page.goto(url, { waitUntil: 'load', timeout: 30000 });
              if (!response || !response.ok()) throw new Error(name + ' HTTP response failed: ' + (response?.status() ?? 'none'));
              await page.waitForTimeout(1800);
              if (name === 'landing-pages') {
                if (!(await page.title()).includes('ایرانگرام')) throw new Error('Landing title missing');
                const appLinks = await page.locator('a[href*="app.html"]').evaluateAll(nodes => nodes.map(a => a.href));
                if (!appLinks.length) throw new Error('App entry link missing');
                if (appLinks.some(href => !href.includes('app.html?v=1.2.3'))) throw new Error('Landing page contains a stale app link: ' + JSON.stringify(appLinks));
              } else {
                await page.waitForFunction(() => !!document.querySelector('#authEmail') || document.querySelector('#modalBack')?.classList.contains('open'), { timeout: 15000 }).catch(() => {});
                const startupState = await page.evaluate(() => ({authEmail:!!document.querySelector('#authEmail'), modalOpen:document.querySelector('#modalBack')?.classList.contains('open'), runtimeError:document.querySelector('#igRuntimeError')?.textContent || '', supabase:!!window.supabase?.createClient}));
                if (startupState.runtimeError) throw new Error('App startup runtime error: ' + startupState.runtimeError);
                if (!startupState.authEmail && !startupState.modalOpen) throw new Error('App startup did not reach login state: ' + JSON.stringify(startupState));
                const visible = await page.locator('#app').evaluate(el => {
                  const r = el.getBoundingClientRect();
                  return r.width > 0 && r.height > 0 && getComputedStyle(el).display !== 'none';
                });
                if (!visible) throw new Error('App interface is not visible');
                const storyStripVisible = await page.locator('#storyStrip').isVisible().catch(() => false);
                if (!storyStripVisible) throw new Error('Story strip is not visible');
                // Verify primary tap targets and channel-row routing without depending on a real user session.
                const authClose = page.locator('#modal [data-close]').first();
                if (await authClose.count()) await authClose.click();
                const storyLogin = page.locator('#storyStrip [data-story-action="login"]');
                if (!(await storyLogin.count())) throw new Error('Story login action is missing');
                await storyLogin.click();
                if (!(await page.locator('#modalBack').evaluate(el => el.classList.contains('open')))) throw new Error('Story login action did not open authentication');
                await page.locator('#modalBack').click({ position: { x: 4, y: 4 } });
                const storyComposerReady = await page.evaluate(async () => {
                  const previousRemote = remoteMode, previousUser = currentUser;
                  remoteMode = true;
                  currentUser = { id: '00000000-0000-0000-0000-000000000002' };
                  await createStory();
                  const ready = !!document.querySelector('#storyFile') && !!document.querySelector('#publishStory');
                  closeModal();
                  remoteMode = previousRemote;
                  currentUser = previousUser;
                  renderStories();
                  return ready;
                });
                if (!storyComposerReady) throw new Error('Story composer did not open');
                await page.locator('#menuBtn').click();
                if (!(await page.locator('#mainMenu').evaluate(el => el.classList.contains('open')))) throw new Error('Main menu button did not open the drawer');
                await page.locator('#mainMenu [data-action="settings"]').click();
                if (!(await page.locator('#modalBack').evaluate(el => el.classList.contains('open')))) throw new Error('Settings menu action did not open settings');
                await page.locator('#modalBack').click({ position: { x: 4, y: 4 } });
                const channelTap = await page.evaluate(() => {
                  const previous = { chats: state.chats, active: state.active, filter: state.filter };
                  state.chats = [{ id: '00000000-0000-0000-0000-000000000001', name: 'کانال آزمایشی', type: 'channels', messages: [], remote: false, unread: 0, color: '', avatar: '📢' }];
                  state.filter = 'channels'; renderChats();
                  const row = document.querySelector('#chatList [data-chat]');
                  if (row) row.click();
                  const result = { rowFound: !!row, active: state.active, headName: document.querySelector('#headName')?.textContent || '' };
                  state.chats = previous.chats; state.active = previous.active; state.filter = previous.filter; renderChats();
                  return result;
                });
                if (!channelTap.rowFound || channelTap.active !== '00000000-0000-0000-0000-000000000001' || !channelTap.headName.includes('کانال آزمایشی')) throw new Error('Channel row tap did not open the conversation: ' + JSON.stringify(channelTap));
                const splashVisible = await page.locator('#appSplash').evaluate(el => getComputedStyle(el).visibility !== 'hidden' && Number(getComputedStyle(el).opacity) > 0.05);
                if (splashVisible) throw new Error('Splash screen did not disappear');
                const html = await page.content();
                for (const marker of ['uploadIranGramStorageFile', 'loadIranGramTus', 'prepareIranGramImage', 'prepareIranGramAvatar', 'startIncomingCallPolling', ".select('id,avatar_url').single()", 'incomingCallSeenIds', 'oniceconnectionstatechange', 'id="storyStrip"', 'function loadStories', 'function createStory', 'function setupStoryRealtime', "from('stories')", 'data-member-role', 'data-remove-member', 'function addConversationMember', 'function runGlobalSearch', 'id="searchResultsPanel"', 'data-search-kind']) {
                  if (!html.includes(marker)) throw new Error('Live app missing ' + marker);
                }
                for (const marker of ['id="stories"', 'id="videoNoteBtn"', 'data-round-video']) {
                  if (html.includes(marker)) throw new Error('Removed feature is still visible in app: ' + marker);
                }
                const drawerAvatarStyle = await page.evaluate(() => {
                  const avatar = document.createElement('div'); avatar.className = 'drawer-avatar';
                  const img = document.createElement('img'); avatar.appendChild(img); document.body.appendChild(avatar);
                  const style = getComputedStyle(img);
                  const result = { width: style.width, height: style.height, fit: style.objectFit, radius: style.borderRadius, overflow: getComputedStyle(avatar).overflow };
                  avatar.remove(); return result;
                });
                if (drawerAvatarStyle.width !== '52px' || drawerAvatarStyle.height !== '52px' || drawerAvatarStyle.fit !== 'cover' || drawerAvatarStyle.radius !== '50%' || drawerAvatarStyle.overflow !== 'hidden') {
                  throw new Error('Drawer profile avatar rendering failed: ' + JSON.stringify(drawerAvatarStyle));
                }
                const mediaStyle = await page.evaluate(() => {
                  const el = document.createElement('video'); el.className = 'media-video'; document.body.appendChild(el);
                  const style = getComputedStyle(el);
                  const result = { radius: style.borderRadius, fit: style.objectFit, height: style.height };
                  el.remove(); return result;
                });
                if (mediaStyle.radius !== '10px' || mediaStyle.fit !== 'contain') throw new Error('Video display CSS is still round/cropped: ' + JSON.stringify(mediaStyle));
                const tusLibraryType = await page.evaluate(async () => typeof (await loadIranGramTus()).Upload);
                if (tusLibraryType !== 'function') throw new Error('TUS upload library did not load');
                const normalized = await page.evaluate(async () => {
                  const canvas = document.createElement('canvas');
                  canvas.width = 32; canvas.height = 24;
                  const ctx = canvas.getContext('2d');
                  ctx.fillStyle = '#168acd'; ctx.fillRect(0, 0, 32, 24);
                  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                  const avatar = await prepareIranGramAvatar(new File([blob], 'avatar.png', { type: '' }), 128);
                  const avatarBitmap = await createImageBitmap(avatar);
                  const avatarResult = { type: avatar.type, width: avatarBitmap.width, height: avatarBitmap.height };
                  avatarBitmap.close();
                  const photo = await prepareIranGramImage(new File([blob], 'photo.png', { type: 'image/png' }), 128);
                  const photoBitmap = await createImageBitmap(photo);
                  const photoResult = { type: photo.type, width: photoBitmap.width, height: photoBitmap.height };
                  photoBitmap.close();
                  return { avatar: avatarResult, photo: photoResult, videoMime: iranGramFileMime(new File([blob], 'clip.mp4', { type: 'video/mp4' })) };
                });
                if (normalized.avatar.type !== 'image/jpeg' || normalized.avatar.width !== 128 || normalized.avatar.height !== 128 || normalized.photo.type !== 'image/jpeg' || normalized.videoMime !== 'video/mp4') {
                  throw new Error('Media normalization failed: ' + JSON.stringify(normalized));
                }
                const uploadPath = await page.evaluate(async () => {
                  const original = supabaseClient;
                  let captured = {};
                  supabaseClient = {
                    auth: { getSession: async () => ({ data: { session: { access_token: 'test-access-token' } }, error: null }) },
                    storage: { from: () => ({ upload: async (path, file, options) => { captured = { path, size: file.size, contentType: options.contentType }; return { error: null }; } }) }
                  };
                  await uploadIranGramStorageFile(new File([new Uint8Array(1024)], 'small.jpg', { type: 'image/jpeg' }), 'test/small.jpg', 'image/jpeg');
                  supabaseClient = original;
                  return captured;
                });
                if (uploadPath.path !== 'test/small.jpg' || uploadPath.contentType !== 'image/jpeg') throw new Error('Small media upload path failed: ' + JSON.stringify(uploadPath));
                const tusPath = await page.evaluate(async () => {
                  const originalClient = supabaseClient, originalTus = window.tus;
                  let captured = {};
                  window.tus = { Upload: class {
                    constructor(file, options) { this.file=file; this.options=options; captured={endpoint:options.endpoint,chunkSize:options.chunkSize,metadata:options.metadata,apikey:options.headers.apikey}; }
                    findPreviousUploads() { return Promise.resolve([]); }
                    start() { this.options.onProgress(this.file.size,this.file.size); this.options.onSuccess(); }
                  }};
                  supabaseClient = { auth: { getSession: async () => ({ data: { session: { access_token: 'test-access-token' } }, error: null }) }, storage: { from: () => ({}) } };
                  await uploadIranGramStorageFile(new File([new Uint8Array(7*1024*1024)], 'clip.mp4', { type: 'video/mp4' }), 'test/clip.mp4', 'video/mp4');
                  supabaseClient = originalClient; window.tus = originalTus;
                  return captured;
                });
                if (!tusPath.endpoint.includes('.storage.supabase.co/storage/v1/upload/resumable') || tusPath.chunkSize !== 6*1024*1024 || tusPath.metadata.objectName !== 'test/clip.mp4' || !tusPath.apikey) {
                  throw new Error('Large video resumable upload path failed: ' + JSON.stringify(tusPath));
                }
                const callProbe = await page.evaluate(async () => {
                  const originalRtc = window.RTCPeerConnection;
                  const originalCall = activeCall, originalUser = currentUser, originalClient = supabaseClient;
                  let config = null, closed = false, stopped = false;
                  class MockPeerConnection {
                    constructor(value) { config = value; this.connectionState = 'new'; this.iceConnectionState = 'new'; }
                    close() { closed = true; }
                    addTrack() {}
                    addIceCandidate() { return Promise.resolve(); }
                    setLocalDescription() { return Promise.resolve(); }
                    setRemoteDescription() { return Promise.resolve(); }
                    createOffer() { return Promise.resolve({ type: 'offer', sdp: 'test' }); }
                    createAnswer() { return Promise.resolve({ type: 'answer', sdp: 'test' }); }
                  }
                  window.RTCPeerConnection = MockPeerConnection;
                  activeCall = { id: 'call-test', peerId: 'peer-test', localStream: { getTracks: () => [{ stop: () => { stopped = true; } }] } };
                  const pc = await getCallPeerConnection();
                  const serverCount = config.iceServers.length;
                  activeCall.pc = pc;
                  await finishCall(false);
                  currentUser = { id: 'user-test' };
                  activeCall = { id: 'call-test', peerId: 'peer-test' };
                  supabaseClient = { from: () => ({ insert: async () => ({ error: { message: 'simulated signal failure' } }) }) };
                  let signalRejected = false;
                  try { await sendCallSignal('offer', {}); } catch (_) { signalRejected = true; }
                  window.RTCPeerConnection = originalRtc; activeCall = originalCall; currentUser = originalUser; supabaseClient = originalClient;
                  return { serverCount, closed, stopped, signalRejected, polling: typeof startIncomingCallPolling === 'function' };
                });
                if (callProbe.serverCount < 2 || !callProbe.closed || !callProbe.stopped || !callProbe.signalRejected || !callProbe.polling) {
                  throw new Error('Call reliability checks failed: ' + JSON.stringify(callProbe));
                }
                const validationProbe = await page.evaluate(async () => {
                  const oldChats = state.chats, oldActive = state.active, oldRemote = remoteMode, oldUser = currentUser, oldToast = window.toast;
                  let toastMessage = '';
                  state.chats = [{ id: '00000000-0000-0000-0000-000000000001', remote: true, type: 'people', messages: [] }];
                  state.active = state.chats[0].id; remoteMode = true; currentUser = { id: '00000000-0000-0000-0000-000000000002' };
                  window.toast = message => { toastMessage = String(message); };
                  await uploadAndSendFile(new File([new Uint8Array([1,2,3])], 'invalid.bin', { type: 'application/x-invalid' }));
                  const result = { message: toastMessage, pendingMessages: state.chats[0].messages.length };
                  state.chats = oldChats; state.active = oldActive; remoteMode = oldRemote; currentUser = oldUser; window.toast = oldToast;
                  return result;
                });
                if (!validationProbe.message.includes('پشتیبانی نمی‌شود') || validationProbe.pendingMessages !== 0) {
                  throw new Error('Media validation error handling failed: ' + JSON.stringify(validationProbe));
                }
                console.log('PASS media and call reliability checks ' + JSON.stringify({normalized,uploadPath,tusPath,callProbe,drawerAvatarStyle,validationProbe}));
              }
              if (errors.length) throw new Error(name + ' JavaScript errors: ' + errors.join(' | '));
              console.log('PASS ' + name + ' ' + response.status() + ' ' + url);
              await page.close();
            }
          } finally {
            await browser.close();
          }
          NODE
