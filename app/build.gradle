plugins { id 'com.android.application' }

def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.amyrmftah3.irangram'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amyrmftah3.irangram'
        minSdk 23
        targetSdk 34
        versionCode 34
        versionName '1.3.12'
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register('syncIranGramAssets', Copy) {
    from(rootProject.file('app.html'))
    from(rootProject.file('icon.svg'))
    into(layout.projectDirectory.dir('src/main/assets'))
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncIranGramAssets')
}
