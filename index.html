/* Telegram-inspired dark interface refresh */
:root{
 --blue:#3390ec;--blue2:#2b82d9;--bg:#0e1621;--panel:#17212b;--text:#f5f7f9;
 --muted:#8b9bab;--line:#263442;--chat:#0e1621;--bubble:#182533;--mine:#2b5278;
 --shadow:none
}
body{background:#0e1621;color:#f5f7f9}
.app{max-width:1500px;background:#17212b;box-shadow:none;grid-template-columns: minmax(320px,420px) 1fr}
.sidebar{background:#17212b;border-left:1px solid #263442}
.topbar{height:58px;background:#17212b;padding:8px 14px;gap:8px}
.brand{gap:10px}.brand b{font-size:17px;font-weight:650;letter-spacing:.1px}
.brand small{display:none}

.iconbtn{border-radius:50%;color:#a9bac9}

.searchbox{padding:7px 12px 10px;border:0;background:#17212b}

.filters{gap:3px;padding:0 9px 7px;background:#17212b;border:0}
.filter{padding:8px 12px;border-radius:8px;color:#9aabba;font-size:13px}
.filter.active{background:#263746;color:#6ab3f3}
.stories{gap:14px;padding:10px 12px 12px;border-bottom:1px solid #263442;background:#17212b}
.story{min-width:58px;color:#a8b8c7;font-size:11px}
.storyring{width:54px;height:54px;padding:2px;background:linear-gradient(135deg,#3390ec,#a855f7,#e4a34b)}
.storyring span{background:#263746;border:2px solid #17212b;color:#e9f3fb}
.storyring.add{background:#354555}.storyring.add span{background:#263746;color:#65b4f5}

.chatrow:hover,.chatrow.selected{background:#202d3a}
.chatrow .avatar{width:52px;height:52px;font-size:19px}
.chathead b{font-size:14px;color:#f2f5f7;font-weight:600}
.time{color:#8294a5;font-size:11px}
.preview{color:#9aabba;font-size:13px;margin-top:5px}
.unread{background:#3390ec;color:#fff;min-width:20px;text-align:center;padding:3px 6px;font-size:11px}
.main{background:#0e1621}
.empty{background:#0e1621;color:#a9bac8}

.chatheader .avatar{width:42px;height:42px}
.chatname b{color:#f2f5f7;font-size:15px}
.chatname small{color:#8da0b1}
.messages{background-color:#0e1621;background-image:radial-gradient(#26344255 1px,transparent 1px);background-size:24px 24px;padding:18px max(14px,6%)}
.daylabel{background:#263746;color:#b6c8d8}

try{const s=JSON.parse(localStorage.getItem('iranGramPro'));if(s&&s.chats&&s.profile)state={...state,...s}}catch(e){}

function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function activeChat(){return state.chats.find(c=>c.id===state.active)}
function renderStories(){const items=[['＋','داستان من','add'],['ن','نیلوفر',''],['ا','آرمان',''],['گ','گروه دوستان',''],['ای','ایران‌گرام','']];$('#stories').innerHTML=items.map((x,i)=>`<div class="story" data-story="${i}"><div class="storyring ${x[2]}"><span>${x[0]}</span></div>${x[1]}</div>`).join('')}
function renderChats(){let arr=state.chats.filter(c=>{const inFolder=state.filter==='all'?!c.archived&&!c.hidden:state.filter==='archive'?!!c.archived:state.filter==='hidden'?!!c.hidden:state.filter==='unread'?c.unread>0:c.type===state.filter;return inFolder&&(`${c.name} ${c.messages.at(-1)?.text||''}`).toLowerCase().includes(state.query.toLowerCase())});const empty=state.filter==='archive'?'<div class="folder-empty"><span class="folder-icon">📂</span><b>آرشیو هنوز خالیه</b><p>گفت‌وگوها را به بالا بکش تا اینجا نگه‌شان داری.</p></div>':state.filter==='hidden'?'<div class="folder-empty"><span class="folder-icon">🗂️</span><b>پوشه مخفی خالیه</b><p>گفت‌وگوهای مخفی‌شده با کشیدن به پایین اینجا می‌آیند.</p></div>':'<div class="folder-empty"><span class="folder-icon">✈️</span><b>گفت‌وگویی پیدا نشد</b><p>یک گفت‌وگوی تازه بساز و شروع کن.</p></div>';$('#chatList').innerHTML=arr.map(c=>{let m=c.messages.at(-1)||{};return `<div class="chatrow ${state.active===c.id?'selected':''}" data-chat="${c.id}"><div class="avatar ${c.color||''}">${esc(c.avatar||c.name[0])}</div><div class="chatinfo"><div class="chathead"><b>${esc(c.name)}${c.verified?' <span class="verified" title="تأییدشده">✓</span>':''}</b><span class="time">${esc(m.time||'')}</span></div><div class="preview">${c.type==='channels'?'📢 ':''}${esc(m.text||'هنوز پیامی نیست')}</div></div>${c.unread?`<span class="unread">${c.unread}</span>`:''}</div>`}).join('')||empty}
function parseMediaMarker(value){const match=String(value||'').match(/^\[\[media:([^|]+)\|([^|]+)\|([^|]+)\]\]$/);if(!match)return null;try{return {path:decodeURIComponent(match[1]),type:decodeURIComponent(match[2]),name:decodeURIComponent(match[3])}}catch(e){return null}}
function renderMessageContent(message){const value=typeof message==='string'?message:(message.text||'');const sticker=String(value).match(/^\[\[sticker:(.+)\]\]$/);if(sticker)return '<span class="animated-sticker" role="img" aria-label="استیکر">'+esc(sticker[1])+'</span>';const media=parseMediaMarker(value);if(media){if(!message||typeof message==='string'||!message.mediaUrl)return '<span class="subtle">📎 '+esc(media.name)+' — در حال بارگذاری</span>';if(media.type.startsWith('image/'))return '<a href="'+esc(message.mediaUrl)+'" target="_blank" rel="noopener noreferrer"><img class="media-image" src="'+esc(message.mediaUrl)+'" alt="'+esc(media.name)+'"></a>';if(media.type.startsWith('video/'))return '<video class="media-video" controls playsinline preload="metadata" src="'+esc(message.mediaUrl)+'"></video><div class="subtle">'+esc(media.name)+'</div>';return '<a href="'+esc(message.mediaUrl)+'" target="_blank" rel="noopener noreferrer" download="'+esc(media.name)+'">📎 '+esc(media.name)+'</a>'}return esc(value)}
async function refreshMediaUrls(chat){if(!remoteMode||!chat||!chat.remote)return;let changed=false;for(const message of chat.messages){const media=parseMediaMarker(message.text);if(!media||message.mediaUrlExpiresAt>Date.now()+60000)continue;const {data,error}=await supabaseClient.storage.from('arogram-chat-media').createSignedUrl(media.path,3600);if(!error&&data?.signedUrl){message.mediaUrl=data.signedUrl;message.mediaUrlExpiresAt=Date.now()+3500*1000;changed=true}}if(changed&&state.active===chat.id)renderMessages()}
function renderMessages(){const c=activeChat();if(!c)return;$('#messages').innerHTML=`<div class="daylabel">امروز</div>`+c.messages.map(m=>`<article class="msg ${m.mine?'mine':''}" data-msg="${m.id}"><p>${renderMessageContent(m)}</p><div class="msgmeta"><span>${esc(m.time||'')}</span>${m.mine?'<span>✓✓</span>':''}</div><div class="msgactions"><button class="tiny" data-react="${m.id}">♡ ${m.reactions?.length||''}</button>${m.mine?`<button class="tiny" data-edit="${m.id}">ویرایش</button><button class="tiny" data-delete="${m.id}">حذف</button>`:''}<button class="tiny" data-reply="${m.id}">پاسخ</button></div></article>`).join('');$('#messages').scrollTop=$('#messages').scrollHeight;const active=activeChat();if(active)refreshMediaUrls(active)}
function openChat(id){const c=state.chats.find(c=>c.id===id);if(!c)return;const canCall=!!(remoteMode&&c.remote&&c.type==='people');$('#audioCallBtn').style.display=canCall?'inline-grid':'none';$('#videoCallBtn').style.display=canCall?'inline-grid':'none';state.active=id;c.unread=0;if(remoteMode&&c.remote&&c.type==='channels')recordChannelActivity(c.id);save();$('#emptyState').style.display='none';$('#chatView').style.display='flex';$('#app').classList.add('chat-open');$('#headAvatar').textContent=c.avatar||c.name[0];$('#headAvatar').className='avatar '+(c.color||'');$('#headName').innerHTML=esc(c.name)+(c.verified?' <span class="verified" title="تأییدشده">✓</span>':'');$('#headStatus').textContent=c.status||'نمایشی';renderChats();renderMessages();$('#messageInput').focus()}
function render(){renderStories();renderChats();if(state.active&&activeChat()){openChatNoFocus()}if(state.profile.theme==='dark')document.body.classList.add('dark');else document.body.classList.remove('dark')}
function openChatNoFocus(){const c=activeChat();const canCall=!!(remoteMode&&c&&c.remote&&c.type==='people');$('#audioCallBtn').style.display=canCall?'inline-grid':'none';$('#videoCallBtn').style.display=canCall?'inline-grid':'none';$('#emptyState').style.display='none';$('#chatView').style.display='flex';$('#headAvatar').textContent=c.avatar||c.name[0];$('#headAvatar').className='avatar '+(c.color||'');$('#headName').textContent=c.name;$('#headStatus').textContent=c.status||'نمایشی';renderMessages()}

let currentUser=null, realtimeChannel=null, remoteMode=false, activityHeartbeat=null;
function authModal(){
 showModal('ورود به ایران‌گرام',`<p class="subtle">برای استفاده از حساب آنلاین، با ایمیل و رمز عبور وارد شو یا حساب بساز.</p><label>ایمیل</label><input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com"><label>رمز عبور</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="حداقل ۶ کاراکتر"><div class="modalactions"><button class="secondary" id="signUpBtn">ساخت حساب</button><button class="primary" id="signInBtn">ورود</button></div><p class="subtle" id="authHint" role="status"></p>`);
 $('#signInBtn').onclick=async()=>{const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password){$('#authHint').textContent='ایمیل و رمز عبور را وارد کن.';return}const {error}=await supabaseClient.auth.signInWithPassword({email,password});$('#authHint').textContent=error?error.message:'ورود انجام شد.';if(!error){closeModal();await startOnline()}};
 $('#signUpBtn').onclick=async()=>{const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||password.length<6){$('#authHint').textContent='ایمیل معتبر و رمز حداقل ۶ کاراکتری وارد کن.';return}const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{name:email.split('@')[0]}}});$('#authHint').textContent=error?error.message:(data.session?'حساب ساخته شد.':'حساب ساخته شد؛ ایمیلت را برای تأیید بررسی کن.');if(data.session){closeModal();await startOnline()}};
}
async function loadOnlineChats(){
 const {data,error}=await supabaseClient.from('conversation_members').select('conversation_id,role,conversations(id,title,type,created_at,messages(id,body,sender_id,created_at))');
 if(error){toast('گرفتن گفتگوها ناموفق بود: '+error.message);return}
 const localFlags=new Map(state.chats.map(c=>[c.id,{archived:!!c.archived,hidden:!!c.hidden}]));
 state.chats=(data||[]).filter(x=>x.conversations).map(x=>{const c=x.conversations,flags=localFlags.get(c.id)||{};return {id:c.id,name:c.title||'گفت‌وگو',type:c.type==='channel'?'channels':(c.type==='group'?'groups':'people'),avatar:c.type==='channel'?'📢':(c.type==='group'?'👥':(c.title||'گ')[0]),status:'گفت‌وگوی آنلاین',unread:0,remote:true,memberRole:x.role,archived:flags.archived,hidden:flags.hidden,messages:(c.messages||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(m=>({id:m.id,text:m.body,mine:m.sender_id===currentUser.id,time:new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),reactions:[]}))}});
 const ids=state.chats.map(c=>c.id);
 if(ids.length){
  const {data:members}=await supabaseClient.from('conversation_members').select('conversation_id,user_id').in('conversation_id',ids);
  const {data:channelStatus,error:statusError}=await supabaseClient.rpc('get_channel_verification_status');if(statusError)console.warn('Channel verification status unavailable',statusError.message);
  const {data:verifiedUsers}=await supabaseClient.from('user_verification_overrides').select('user_id').eq('is_verified',true);
  const verifiedSet=new Set((verifiedUsers||[]).map(x=>x.user_id));
  const statusMap=new Map((channelStatus||[]).map(x=>[x.channel_id,x]));
  for(const c of state.chats){
   const st=statusMap.get(c.id);if(st){c.verified=st.is_verified;c.active_users_30d=st.active_users_30d}
   if(c.type==='people'){const peer=(members||[]).find(m=>m.conversation_id===c.id&&m.user_id!==currentUser.id);if(peer){c.recipientUserId=peer.user_id;c.verified=verifiedSet.has(peer.user_id)}}
  }
 }
 if(!state.chats.some(c=>c.id===state.active))state.active=null;
 renderChats();
 if(state.active)openChatNoFocus();else{$('#chatView').style.display='none';$('#emptyState').style.display='grid'}
}
async function recordChannelActivity(channelId){if(!remoteMode||!currentUser||!channelId)return;const {error}=await supabaseClient.rpc('record_channel_activity',{p_channel_id:channelId});if(error){console.warn('Channel activity update failed',error.message);return}const {data}=await supabaseClient.rpc('get_channel_verification_status');const status=(data||[]).find(x=>x.channel_id===channelId),c=state.chats.find(x=>x.id===channelId);if(status&&c){c.verified=status.is_verified;c.active_users_30d=status.active_users_30d;renderChats()}}
async function startOnline(){
 const {data,error}=await supabaseClient.auth.getUser();
 if(error||!data.user){authModal();return}
 currentUser=data.user;remoteMode=true;
 await loadOnlineChats();
 await setupCallRealtime();
 if(activityHeartbeat)clearInterval(activityHeartbeat);
 activityHeartbeat=setInterval(()=>{const c=activeChat();if(c&&c.remote&&c.type==='channels')recordChannelActivity(c.id)},10*60*1000);
 if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
 realtimeChannel=supabaseClient.channel('iran-gram-live-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{
   const m=payload.new;const c=state.chats.find(x=>x.id===m.conversation_id);if(!c||m.sender_id===currentUser.id)return;
   c.messages.push({id:m.id,text:m.body,mine:false,time:new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),reactions:[]});
   if(state.active===c.id)renderMessages();renderChats();
 }).subscribe();
}

function callIsSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.RTCPeerConnection)}
function callPeerId(chat){return chat&&chat.remote&&chat.type==='people'&&chat.id?chat.id:null}

 const {error}=await supabaseClient.from('call_signals').insert({call_id:activeCall.id,sender_id:currentUser.id,recipient_id:activeCall.peerId,kind,payload});
 if(error)console.warn('Call signal failed',error.message);
}

 $('#callAvatar').textContent=(name||'آ')[0];$('#remoteVideo').srcObject=null;$('#localVideo').srcObject=activeCall?.localStream||null;
}
function startCallClock(){
 callSeconds=0;if(callClock)clearInterval(callClock);
 callClock=setInterval(()=>{callSeconds++;$('#callTimer').textContent=String(Math.floor(callSeconds/60)).padStart(2,'0')+':'+String(callSeconds%60).padStart(2,'0')},1000);
}
async function getCallPeerConnection(){
 const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
 activeCall.pc=pc;
 pc.onicecandidate=e=>{if(e.candidate)sendCallSignal('ice',e.candidate.toJSON())};
 pc.ontrack=e=>{const stream=e.streams&&e.streams[0];if(stream){$('#remoteVideo').srcObject=stream;$('#callAvatar').style.display='none';$('#remoteVideo').style.display='block';$('#remoteVideo').play().catch(()=>{})}};
 pc.onconnectionstatechange=()=>{if(!activeCall||activeCall.pc!==pc)return;if(pc.connectionState==='connected'){startCallClock();$('#callTimer').textContent='متصل'}else if(pc.connectionState==='failed'){toast('اتصال برقرار نشد؛ ممکن است شبکه به TURN نیاز داشته باشد')}else if(pc.connectionState==='disconnected')$('#callTimer').textContent='اتصال ناپایدار…'};
 return pc;
}
async function addLocalCallMedia(type){
 const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==='video'?{facingMode:'user'}:false});
 activeCall.localStream=stream;$('#localVideo').srcObject=stream;return stream;
}
async function flushCallIce(){
 if(!activeCall||!activeCall.pc||!activeCall.pc.remoteDescription)return;
 const queued=activeCall.iceQueue||[];activeCall.iceQueue=[];
 for(const candidate of queued){try{await activeCall.pc.addIceCandidate(new RTCIceCandidate(candidate))}catch(e){console.warn('ICE candidate skipped',e)}}
}
async function handleCallSignal(row){
 if(!activeCall&&pendingIncomingCall&&row.call_id===pendingIncomingCall.id&&(row.kind==='end'||row.kind==='reject')){pendingIncomingCall=null;closeModal();toast('تماس لغو شد');return}
 if(!activeCall||row.call_id!==activeCall.id)return;
 if(activeCall.seenSignalIds?.has(row.id))return;if(activeCall.seenSignalIds)activeCall.seenSignalIds.add(row.id);
 try{
  if(row.kind==='offer'){activeCall.offer=row.payload;if(activeCall.accepting)await acceptOffer(row.payload)}
  else if(row.kind==='answer'){if(callRingTimeout)clearTimeout(callRingTimeout);callRingTimeout=null;await activeCall.pc.setRemoteDescription(new RTCSessionDescription(row.payload));await flushCallIce();startCallClock()}
  else if(row.kind==='ice'){if(activeCall.pc.remoteDescription)await activeCall.pc.addIceCandidate(new RTCIceCandidate(row.payload));else activeCall.iceQueue.push(row.payload)}
  else if(row.kind==='reject'||row.kind==='busy'){toast(row.kind==='busy'?'مخاطب در حال مکالمه است':'تماس رد شد');finishCall(false)}
  else if(row.kind==='end'){toast('تماس پایان یافت');finishCall(false)}
 }catch(e){console.error('Call signal processing failed',e);toast('خطا در برقراری تماس')}
}
async function acceptOffer(offer){
 if(!activeCall||!offer||activeCall.answerSent)return;
 activeCall.answerSent=true;
 await activeCall.pc.setRemoteDescription(new RTCSessionDescription(offer));await flushCallIce();
 const answer=await activeCall.pc.createAnswer();await activeCall.pc.setLocalDescription(answer);
 await sendCallSignal('answer',activeCall.pc.localDescription.toJSON());
 $('#callTimer').textContent='در حال اتصال…';
}
async function setupCallRealtime(){
 if(callSignalChannel)supabaseClient.removeChannel(callSignalChannel);
 if(callInviteChannel)supabaseClient.removeChannel(callInviteChannel);
 callSignalChannel=supabaseClient.channel('arogram-call-signals-'+currentUser.id)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'call_signals',filter:'recipient_id=eq.'+currentUser.id},payload=>handleCallSignal(payload.new)).subscribe();
 callInviteChannel=supabaseClient.channel('arogram-call-invites-'+currentUser.id)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'call_sessions',filter:'callee_id=eq.'+currentUser.id},payload=>receiveIncomingCall(payload.new)).subscribe();
}
async function receiveIncomingCall(row){
 if(!row||row.callee_id!==currentUser.id)return;
 if(activeCall){const temp={id:row.id,peerId:row.caller_id};const previous=activeCall;activeCall=temp;await sendCallSignal('busy',{});activeCall=previous;return}
 const {data:profile}=await supabaseClient.from('profiles').select('display_name').eq('id',row.caller_id).maybeSingle();
 pendingIncomingCall=row;
 showModal('تماس ورودی',`<div style="text-align:center;padding:12px"><div style="font-size:44px">📞</div><b>${esc(profile?.display_name||'کاربر ایران‌گرام')}</b><p class="subtle">${row.call_type==='video'?'تماس تصویری':'تماس صوتی'}</p></div><div class="modalactions"><button class="secondary" id="rejectIncoming">رد تماس</button><button class="primary" id="acceptIncoming">پاسخ دادن</button></div>`);
 $('#rejectIncoming').onclick=async()=>{const incoming=pendingIncomingCall;pendingIncomingCall=null;closeModal();activeCall={id:incoming.id,peerId:incoming.caller_id};await sendCallSignal('reject',{});activeCall=null};
 $('#acceptIncoming').onclick=async()=>{const incoming=pendingIncomingCall;pendingIncomingCall=null;closeModal();await acceptIncomingCall(incoming,profile?.display_name||'کاربر ایران‌گرام')};
}
async function acceptIncomingCall(row,name){
 if(!callIsSupported()){toast('مرورگر این دستگاه از تماس پشتیبانی نمی‌کند');return}
 activeCall={id:row.id,peerId:row.caller_id,type:row.call_type,iceQueue:[],seenSignalIds:new Set(),accepting:true};
 try{
  await addLocalCallMedia(row.call_type);showCallOverlay(row.call_type,name);
  const pc=await getCallPeerConnection();activeCall.accepting=true;
  activeCall.localStream.getTracks().forEach(track=>pc.addTrack(track,activeCall.localStream));
  const {data:signals,error}=await supabaseClient.from('call_signals').select('id,kind,payload').eq('call_id',row.id).in('kind',['offer','ice']).order('created_at',{ascending:true});
  if(error)throw error;
  let offer=activeCall.offer;for(const signal of (signals||[])){activeCall.seenSignalIds.add(signal.id);if(signal.kind==='offer')offer=signal.payload;else if(signal.kind==='ice')activeCall.iceQueue.push(signal.payload)}
  if(offer)await acceptOffer(offer);
 }catch(e){console.error(e);toast('دسترسی به میکروفون یا دوربین ممکن نشد: '+(e.message||''));finishCall(false)}
}
async function startOutgoingCall(type){
 const chat=activeChat();if(!chat||!chat.remote||chat.type!=='people'){toast('تماس فعلاً فقط در گفت‌وگوی خصوصی آنلاین فعال است');return}
 if(!callIsSupported()){toast('مرورگر این دستگاه از تماس پشتیبانی نمی‌کند');return}
 if(activeCall){toast('در حال حاضر یک تماس فعال داری');return}
 try{
  const {data:members,error:membersError}=await supabaseClient.from('conversation_members').select('user_id').eq('conversation_id',chat.id).neq('user_id',currentUser.id).limit(1);
  if(membersError||!members?.length)throw membersError||new Error('مخاطب پیدا نشد');
  const peerId=members[0].user_id;
  const {data:profile}=await supabaseClient.from('profiles').select('display_name').eq('id',peerId).maybeSingle();
  activeCall={peerId,type,iceQueue:[],seenSignalIds:new Set(),initiator:true};
  await addLocalCallMedia(type);
  const {data:session,error}=await supabaseClient.from('call_sessions').insert({conversation_id:chat.id,caller_id:currentUser.id,callee_id:peerId,call_type:type}).select('id').single();
  if(error)throw error;
  activeCall.id=session.id;showCallOverlay(type,profile?.display_name||chat.name);
  const pc=await getCallPeerConnection();
  activeCall.localStream.getTracks().forEach(track=>pc.addTrack(track,activeCall.localStream));
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  await sendCallSignal('offer',pc.localDescription.toJSON());
  $('#callTimer').textContent='در انتظار پاسخ…';
  if(callRingTimeout)clearTimeout(callRingTimeout);callRingTimeout=setTimeout(()=>{if(activeCall?.id===session.id){toast('پاسخی دریافت نشد');finishCall(true)}},45000);
 }catch(e){console.error(e);toast('شروع تماس ناموفق بود: '+(e.message||'خطای دسترسی یا سرور'));finishCall(false)}
}
async function finishCall(notify=true){
 const call=activeCall;if(!call)return;
 activeCall=null;if(callRingTimeout)clearTimeout(callRingTimeout);callRingTimeout=null;if(callClock)clearInterval(callClock);callClock=null;
 if(notify&&call.id){activeCall=call;await sendCallSignal('end',{});activeCall=null}
 try{call.pc?.close()}catch(e){}
 call.localStream?.getTracks().forEach(track=>track.stop());
 $('#remoteVideo').srcObject=null;$('#localVideo').srcObject=null;$('#callOverlay').classList.remove('open','audio');$('#callAvatar').style.display='grid';closeModal();
}

}


async function uploadAndSendFile(file){
 const c=activeChat();if(!c){toast('اول یک گفت‌وگو انتخاب کن');return}
 if(!remoteMode||!currentUser||!c.remote){toast('ارسال فایل فقط در گفت‌وگوی آنلاین فعال است.');return}
 if(c.type==='channels'&&c.memberRole!=='owner'){toast('فقط مدیر کانال می‌تواند در کانال فایل بفرستد.');return}
 if(file.size>50*1024*1024){toast('حجم فایل باید کمتر از ۵۰ مگابایت باشد.');return}
 const allowed=/^(image\/(jpeg|png|webp|gif)|video\/(mp4|webm)|audio\/(mpeg|ogg|mp4)|application\/(pdf|zip)|text\/plain)$/i;
 if(!allowed.test(file.type||'')){toast('این نوع فایل پشتیبانی نمی‌شود.');return}
 const safeName=(file.name||'file').replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,120)||'file';
 const path=c.id+'/'+currentUser.id+'/'+Date.now()+'_'+safeName;
 const {error:uploadError}=await supabaseClient.storage.from('arogram-chat-media').upload(path,file,{upsert:false,contentType:file.type});
 if(uploadError){toast('آپلود فایل ناموفق بود: '+uploadError.message);return}
 const body='[[media:'+encodeURIComponent(path)+'|'+encodeURIComponent(file.type)+'|'+encodeURIComponent(file.name||safeName)+']]';
 const {error}=await supabaseClient.from('messages').insert({conversation_id:c.id,sender_id:currentUser.id,body});
 if(error){await supabaseClient.storage.from('arogram-chat-media').remove([path]);toast('ثبت پیام فایل ناموفق بود: '+error.message);return}
 c.messages.push({id:uid(),text:body,mine:true,time:now(),reactions:[]});save();renderMessages();renderChats();
}

 <h4>تیک آبی کاربران</h4><label>انتخاب کاربر</label><select id="adminUser"><option value="">انتخاب کن</option>${userOptions}</select><div class="modalactions"><button class="primary" id="giveUserTick">دادن تیک آبی</button><button class="secondary" id="removeUserTick">برداشتن تیک</button></div>
 <h4>تیک آبی کانال</h4><label>انتخاب کانال</label><select id="adminChannel"><option value="">انتخاب کن</option>${channelOptions}</select><div class="modalactions"><button class="primary" id="giveChannelTick">دادن تیک</button><button class="secondary" id="removeChannelTick">برداشتن تیک دستی</button></div><p class="subtle">شرط خودکار: حداقل ۱۵٬۰۰۰ کاربر فعال یکتا در ۳۰ روز گذشته.</p>
 <h4>تبلیغ کانال</h4><label>عنوان تبلیغ</label><input id="adTitle" placeholder="مثلاً کانال فناوری"><label>لینک مقصد (HTTPS)</label><input id="adUrl" type="url" placeholder="https://..."><label>کانال ایران‌گرام (اختیاری)</label><select id="adChannel"><option value="">فقط لینک خارجی</option>${channelOptions}</select><label>پایان تبلیغ</label><input id="adEnd" type="datetime-local"><button class="primary" id="createAd" style="width:100%;margin-top:10px">ثبت و فعال‌سازی تبلیغ</button>
 <h4>تبلیغات ثبت‌شده</h4>${adRows}<div class="modalactions"><button class="secondary" data-close>بستن</button></div>`);
 const setTick=async(kind,enabled)=>{const id=kind==='user'?$('#adminUser').value:$('#adminChannel').value;if(!id){toast('ابتدا یک مورد انتخاب کن.');return}const table=kind==='user'?'user_verification_overrides':'channel_verification_overrides',key=kind==='user'?'user_id':'channel_id';const {error}=await supabaseClient.from(table).upsert({[key]:id,is_verified:enabled,reason:enabled?'تأیید توسط مدیر اصلی': 'لغو تیک دستی',updated_by:currentUser.id},{onConflict:key});if(error){toast('ثبت تیک ناموفق بود: '+error.message);return}toast(enabled?'تیک آبی ثبت شد.':'تیک دستی برداشته شد.');await loadOnlineChats();adminPanel()};
 $('#giveUserTick').onclick=()=>setTick('user',true);$('#removeUserTick').onclick=()=>setTick('user',false);
 $('#giveChannelTick').onclick=()=>setTick('channel',true);$('#removeChannelTick').onclick=()=>setTick('channel',false);
 $('#createAd').onclick=async()=>{const title=$('#adTitle').value.trim(),url=$('#adUrl').value.trim(),end=$('#adEnd').value;if(!title||!url.startsWith('https://')||!end){toast('عنوان، لینک HTTPS و زمان پایان را کامل کن.');return}const {error}=await supabaseClient.from('advertisements').insert({title,target_url:url,channel_id:$('#adChannel').value||null,starts_at:new Date().toISOString(),ends_at:new Date(end).toISOString(),status:'active',created_by:currentUser.id});if(error){toast('ثبت تبلیغ ناموفق بود: '+error.message);return}toast('تبلیغ ثبت و فعال شد.');adminPanel()};
}

$('#menuBtn').onclick=()=>$('#mainMenu').classList.toggle('open');$('#audioCallBtn').onclick=()=>startOutgoingCall('audio');$('#videoCallBtn').onclick=()=>startOutgoingCall('video');$('#endCallBtn').onclick=()=>finishCall(true);$('#muteCallBtn').onclick=()=>{const track=activeCall?.localStream?.getAudioTracks()[0];if(track){track.enabled=!track.enabled;$('#muteCallBtn').textContent=track.enabled?'🎙️':'🔇'}};$('#cameraCallBtn').onclick=()=>{const track=activeCall?.localStream?.getVideoTracks()[0];if(track){track.enabled=!track.enabled;$('#cameraCallBtn').textContent=track.enabled?'📷':'🚫'}};$('#newBtn').onclick=newChat;$('#startChat').onclick=newChat;$('#sendBtn').onclick=sendMessage;$('#messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('#messageInput').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});$('#backBtn').onclick=()=>$('#app').classList.remove('chat-open');$('#search').oninput=e=>{state.query=e.target.value;renderChats()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;renderChats()});
$('#mainMenu').onclick=e=>{const b=e.target.closest('button[data-action]');if(!b)return;$('#mainMenu').classList.remove('open');({profile:profileModal,group:()=>createCollection('groups'),channel:()=>createCollection('channels'),settings:settingsModal,ads:advertisementsModal,admin:adminPanel,export:exportData,logout:async()=>{if(remoteMode){await supabaseClient.auth.signOut()}else{toast('حساب آنلاینی وارد نشده است')}},about:()=>showModal('درباره ایران‌گرام',`<p>ایران‌گرام یک نمونه اولیه پیام‌رسان با رابط کاربری فارسی است.</p><p class="subtle">برای چت بین کاربران، ورود امن، آپلود واقعی فایل، استوری آنلاین، اعلان‌ها و نسخه اندروید، باید بک‌اند و سرویس‌های مربوطه پیاده‌سازی و متصل شوند.</p><div class="modalactions"><button class="primary" data-close>متوجه شدم</button></div>`)})[b.dataset.action]()};
let suppressChatClick=false;
$('#chatList').onclick=e=>{if(suppressChatClick){suppressChatClick=false;e.preventDefault();return}const row=e.target.closest('[data-chat]');if(row)openChat(row.dataset.chat)};
let chatTouchStart=null;
const clearSwipeHint=()=>document.querySelectorAll('.chatrow.swipe-archive,.chatrow.swipe-hidden').forEach(x=>x.classList.remove('swipe-archive','swipe-hidden'));
$('#chatList').addEventListener('touchstart',e=>{
 suppressChatClick=false;clearSwipeHint();
 const row=e.target.closest('[data-chat]');
 if(row)chatTouchStart={id:row.dataset.chat,y:e.changedTouches[0].clientY,row};
},{passive:true});
$('#chatList').addEventListener('touchmove',e=>{
 if(!chatTouchStart)return;
 const dy=e.touches[0].clientY-chatTouchStart.y;
 chatTouchStart.row.classList.toggle('swipe-archive',dy < -22);
 chatTouchStart.row.classList.toggle('swipe-hidden',dy > 22);
},{passive:true});
$('#chatList').addEventListener('touchend',e=>{
 if(!chatTouchStart)return;
 const gesture=chatTouchStart;const dy=e.changedTouches[0].clientY-gesture.y;
 const c=state.chats.find(x=>x.id===gesture.id);chatTouchStart=null;
 if(!c){clearSwipeHint();return}
 if(dy < -75){
  suppressChatClick=true;c.archived=true;c.hidden=false;save();renderChats();toast('گفت‌وگو به آرشیو رفت');
 }else if(dy > 75){
  suppressChatClick=true;c.hidden=true;c.archived=false;save();renderChats();toast('گفت‌وگو به پوشه مخفی رفت');
 }else clearSwipeHint();
},{passive:true});
$('#chatList').addEventListener('touchcancel',()=>{chatTouchStart=null;clearSwipeHint()},{passive:true});
$('#messages').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=activeChat();if(!c)return;const id=b.dataset.react||b.dataset.edit||b.dataset.delete||b.dataset.reply;const m=c.messages.find(x=>x.id===id);if(!m)return;if(b.dataset.react!==undefined){m.reactions=m.reactions||[];m.reactions.push('♡');save();renderMessages()}else if(b.dataset.delete!==undefined){if(confirm('این پیام از همین دستگاه حذف شود؟')){c.messages=c.messages.filter(x=>x.id!==id);save();renderChats();renderMessages()}}else if(b.dataset.edit!==undefined){showModal('ویرایش پیام',`<textarea id="editText">${esc(m.text)}</textarea><div class="modalactions"><button class="secondary" data-close>انصراف</button><button class="primary" id="saveEdit">ذخیره</button></div>`);$('#saveEdit').onclick=()=>{m.text=$('#editText').value;save();closeModal();renderChats();renderMessages()}}else if(b.dataset.reply!==undefined){state.reply=id;$('#messageInput').placeholder='پاسخ به پیام انتخاب‌شده...';$('#messageInput').focus();toast('حالا پاسخ را بنویس و ارسال کن')}};
$('#stories').onclick=e=>{const el=e.target.closest('[data-story]');if(!el)return;if(el.dataset.story==='0'){showModal('داستان من',`<label>متن داستان</label><textarea id="storyText" placeholder="چه خبر؟"></textarea><div class="modalactions"><button class="secondary" data-close>انصراف</button><button class="primary" id="postStory">انتشار نمایشی</button></div><p class="subtle">داستان فقط به‌صورت آزمایشی روی همین دستگاه ثبت می‌شود.</p>`);$('#postStory').onclick=()=>{const t=$('#storyText').value.trim();closeModal();toast(t?'داستان نمایشی ثبت شد':'متنی وارد نکردی')}}else toast('استوری‌های این نسخه نمونه هستند و از کاربران واقعی دریافت نمی‌شوند')};
$('#emojiBtn').onclick=()=>{const input=$('#messageInput');input.value+=' 😊';input.focus()};$('#stickerBtn').onclick=stickerModal;$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-sticker]');if(b)sendSticker(b.dataset.sticker)});$('#attachBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{const files=[...e.target.files];for(const file of files)await uploadAndSendFile(file);e.target.value=''};
$('#chatSearchBtn').onclick=()=>{showModal('جست‌وجوی پیام',`<label>عبارت موردنظر</label><input id="msgSearch" placeholder="متن پیام"><div id="searchResults" class="subtle" style="margin-top:10px"></div><div class="modalactions"><button class="secondary" data-close>بستن</button><button class="primary" id="doSearch">جست‌وجو</button></div>`);$('#doSearch').onclick=()=>{const q=$('#msgSearch').value.toLowerCase();const hits=activeChat().messages.filter(m=>m.text.toLowerCase().includes(q));$('#searchResults').innerHTML=hits.length?hits.map(m=>`<p>• ${esc(m.text)}</p>`).join(''):'چیزی پیدا نشد.'}};
$('#chatMoreBtn').onclick=()=>{const c=activeChat();if(!c)return;showModal('گزینه‌های گفت‌وگو',`<button class="secondary" id="clearChat" style="width:100%;margin-bottom:8px">پاک‌کردن پیام‌های این گفت‌وگو</button><button class="secondary" id="archiveChat" style="width:100%;margin-bottom:8px">${c.archived?'بازگرداندن از آرشیو':'انتقال به آرشیو'}</button><button class="secondary" id="hideChat" style="width:100%;margin-bottom:8px">${c.hidden?'نمایش دوباره گفت‌وگو':'مخفی‌کردن گفت‌وگو'}</button><p class="subtle">کشیدن گفت‌وگو به بالا: آرشیو | کشیدن به پایین: مخفی‌کردن</p><div class="modalactions"><button class="primary" data-close>بستن</button></div>`)};$('#modal').addEventListener('click',e=>{if(e.target.matches('[data-close]'))closeModal();if(e.target.id==='clearChat'){if(confirm('پیام‌های این گفت‌وگو پاک شوند؟')){activeChat().messages=[];save();closeModal();renderMessages();renderChats()}}if(e.target.id==='archiveChat'){const c=activeChat();c.archived=!c.archived;if(c.archived)c.hidden=false;save();closeModal();renderChats()}if(e.target.id==='hideChat'){const c=activeChat();c.hidden=!c.hidden;if(c.hidden)c.archived=false;save();closeModal();renderChats()}});$('#modalBack').onclick=e=>{if(e.target===$('#modalBack'))closeModal()};
const splashPoems=['پیام تازه، آغاز راهی تازه؛ دل‌ها نزدیک‌تر از همیشه.','به وقت هم‌صحبتی، فاصله‌ها کوتاه می‌شوند.','هر پیام، پلی کوچک میان دو جهان.','با هم حرف بزنیم؛ دنیا با گفت‌وگو روشن‌تر است.'];$('#splashPoem').textContent=splashPoems[Math.floor(Math.random()*splashPoems.length)];
if(!window.supabase){toast('بارگذاری سرویس ورود ناموفق بود. صفحه را تازه‌سازی کن.')}else{initAuth()}
</script>
</body>
</html>
