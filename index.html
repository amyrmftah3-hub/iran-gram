<style>
:root{--blue:#168acd;--blue2:#087fbd;--bg:#e9f1f6;--panel:#fff;--text:#17212b;--muted:#71808f;--line:#e6edf2;--chat:#dcecf4;--bubble:#fff;--mine:#d9fdd3;--shadow:0 5px 24px #0a3a5510}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #42a5f5;outline-offset:2px}.app{height:100dvh;max-width:1400px;margin:auto;background:var(--panel);display:grid;grid-template-columns:360px 1fr;box-shadow:var(--shadow);overflow:hidden}.sidebar{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--panel)}.topbar{height:64px;background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}.brand{display:flex;align-items:center;gap:10px;flex:1}.logo{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#102b52,#087fc0);border:2px solid #d6b25c;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:bold;flex-shrink:0}.brand b{display:block;font-size:17px}.brand small{display:block;opacity:.85;font-size:11px;margin-top:3px}.iconbtn{background:transparent;color:inherit;font-size:22px;padding:7px;border-radius:50%;min-width:38px;min-height:38px}.iconbtn:hover{background:#ffffff20}.searchbox{padding:12px;border-bottom:1px solid var(--line)}.searchbox input{width:100%;border:0;border-radius:24px;background:#f0f3f5;padding:12px 16px;outline:none}.filters{display:flex;gap:6px;padding:9px 10px;border-bottom:1px solid var(--line);overflow:auto}.filter{padding:8px 12px;border-radius:18px;background:transparent;color:var(--muted);white-space:nowrap;font-size:12px}.filter.active{background:#e0f2fc;color:var(--blue);font-weight:bold}.stories{display:flex;gap:12px;padding:12px;overflow:auto;border-bottom:1px solid var(--line)}.story{min-width:60px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer}.storyring{width:48px;height:48px;border-radius:50%;padding:3px;margin:0 auto 5px;background:linear-gradient(45deg,#00a6df,#8c5bdb,#ffb347)}.storyring span{display:grid;place-items:center;background:#dcecf4;border:2px solid white;width:100%;height:100%;border-radius:50%;font-weight:bold;color:#1b789e;font-size:16px}.storyring.add{background:#e7edf1;padding:2px}.storyring.add span{border:0;background:#f6f8fa;font-size:25px;color:var(--blue)}.chats{overflow:auto;flex:1}.chatrow{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;border-bottom:1px solid #f0f3f5}.chatrow:hover,.chatrow.selected{background:#eaf5fc}.avatar{width:50px;height:50px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#d4effc,#8ccce9);color:#075f91;font-weight:bold;font-size:18px;position:relative}.avatar.green{background:linear-gradient(135deg,#dff5e8,#8ed2b2);color:#16764b}.avatar.gold{background:linear-gradient(135deg,#ffedc4,#e4ba66);color:#79510a}.avatar.purple{background:linear-gradient(135deg,#eee1ff,#c1a5f3);color:#6540a1}.chatinfo{min-width:0;flex:1}.chathead{display:flex;justify-content:space-between;gap:5px;align-items:center}.chathead b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:var(--muted);white-space:nowrap}.preview{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread{background:#27a5e7;color:white;border-radius:14px;padding:2px 6px;font-size:10px}.main{min-width:0;display:flex;flex-direction:column;background:var(--chat);position:relative}.empty{flex:1;display:grid;place-items:center;text-align:center;color:#54707e;padding:25px}.emptycard{background:#ffffffb8;border-radius:20px;padding:24px;max-width:330px}.emptycard .plane{font-size:52px}.emptycard h2{margin:10px 0;font-size:21px}.emptycard p{font-size:13px;line-height:1.9}.chatview{display:flex;flex-direction:column;height:100%;min-height:0}.chatheader{height:64px;background:var(--panel);display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}.chatheader .avatar{width:43px;height:43px}.chatname{flex:1;min-width:0}.chatname b{display:block;font-size:14px}.chatname small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.messages{flex:1;overflow:auto;padding:18px max(14px,5%);display:flex;flex-direction:column;gap:9px;background-color:#dcecf4;background-image:radial-gradient(#ffffff55 1px,transparent 1px);background-size:22px 22px}.daylabel{align-self:center;background:#7895a450;color:#355667;padding:5px 12px;border-radius:12px;font-size:11px;margin-bottom:5px}.msg{max-width:min(78%,520px);padding:9px 11px 6px;border-radius:14px;background:var(--bubble);box-shadow:0 1px 2px #17354812;align-self:flex-start;overflow-wrap:anywhere;position:relative}.msg.mine{align-self:flex-end;background:var(--mine);border-bottom-right-radius:4px}.msg:not(.mine){border-bottom-left-radius:4px}.msg p{margin:0;white-space:pre-wrap;font-size:14px;line-height:1.65}.msgmeta{display:flex;justify-content:flex-end;align-items:center;gap:6px;color:#72828c;font-size:10px;margin-top:4px}.msgactions{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}.tiny{background:#ffffff80;color:#60727e;border-radius:10px;font-size:11px;padding:3px 6px}.composer{display:flex;align-items:flex-end;gap:8px;padding:10px;background:#f6f8f9;border-top:1px solid var(--line)}.composefield{flex:1;display:flex;align-items:flex-end;gap:8px;background:#fff;border:1px solid #e4eaee;border-radius:24px;padding:6px 10px;min-width:0}.composefield textarea{resize:none;max-height:120px;min-height:34px;flex:1;border:0;outline:none;padding:8px 0;background:transparent;line-height:1.5}.send{background:var(--blue);color:white;width:43px;height:43px;border-radius:50%;font-size:19px;flex-shrink:0}.send:hover{background:var(--blue2)}.round{width:42px;height:42px;border-radius:50%;background:#fff;color:#5c7380;font-size:20px;flex-shrink:0}.welcome{display:none}.modalback{position:fixed;inset:0;background:#0b1c2b80;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modalback.open{display:flex}.modal{background:var(--panel);border-radius:18px;padding:20px;width:min(440px,100%);max-height:90dvh;overflow:auto;box-shadow:0 15px 50px #0003}.modal h3{margin:0 0 16px}.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}.modal input,.modal textarea,.modal select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text)}.modal textarea{min-height:80px;resize:vertical}.modalactions{display:flex;gap:8px;margin-top:16px}.primary{background:var(--blue);color:#fff;padding:11px 16px;border-radius:10px;flex:1}.secondary{background:#eef3f6;color:var(--text);padding:11px 16px;border-radius:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17212b;color:white;padding:11px 18px;border-radius:20px;font-size:12px;display:none;z-index:10;max-width:90%;text-align:center}.toast.show{display:block}.menu{position:absolute;top:60px;left:12px;background:var(--panel);border-radius:12px;box-shadow:0 8px 28px #0002;padding:6px;z-index:3;display:none;min-width:180px}.menu.open{display:block}.menu button{display:block;width:100%;text-align:right;background:transparent;color:var(--text);padding:12px;border-radius:8px;font-size:13px}.menu button:hover{background:#edf5fa}.subtle{font-size:11px;color:var(--muted);line-height:1.8}.dark{--bg:#0e1720;--panel:#17212b;--text:#e8eef3;--muted:#9aabb8;--line:#2b3945;--chat:#0d1c27;--bubble:#202e3a;--mine:#214b43;--shadow:0 5px 24px #0002}.dark .searchbox input{background:#263441;color:var(--text)}.dark .filter.active{background:#203b4d}.dark .chatrow:hover,.dark .chatrow.selected{background:#20313f}.dark .composer{background:#17212b}.dark .composefield,.dark .round{background:#202e3a;color:var(--text);border-color:#34434f}.dark .messages{background-color:#0d1c27}.dark .emptycard{background:#17212be0}.dark .secondary{background:#263441;color:var(--text)}.dark .storyring span{background:#203441;border-color:#17212b}.dark .storyring.add span{background:#202e3a}.dark .tiny{background:#20313f;color:#c4d0d8}
@media(max-width:760px){.app{display:block;height:100dvh}.sidebar{height:100%;border:0}.main{display:none;height:100dvh}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.topbar{height:60px}.chatheader{height:60px}.messages{padding:14px 10px}.msg{max-width:88%}.backbtn{display:block!important}.filters{padding-top:7px;padding-bottom:7px}.chatrow{padding:10px}.avatar{width:47px;height:47px}}
@media(min-width:761px){.backbtn{display:none!important}}

<body>
<div class="app" id="app">
<aside class="sidebar">
 <header class="topbar">
  <div class="brand"><div class="logo">ای</div><div><b>ایرانگرام</b><small>پیام‌رسان ایرانی</small></div></div>
  <button class="iconbtn" id="newBtn" title="گفتگوی جدید">✎</button><button class="iconbtn" id="menuBtn" title="منو">☰</button>
 </header>
 <div class="menu" id="mainMenu">
  <button data-action="profile">👤 پروفایل من</button><button data-action="group">👥 ساخت گروه</button><button data-action="channel">📢 ساخت کانال</button><button data-action="settings">⚙️ تنظیمات</button><button data-action="export">⬇️ خروجی پشتیبان</button><button data-action="about">ℹ️ درباره ایرانگرام</button>
 </div>
 <div class="searchbox"><input id="search" placeholder="جست‌وجو در گفتگوها" autocomplete="off"></div>
 <div class="filters"><button class="filter active" data-filter="all">همه</button><button class="filter" data-filter="unread">خوانده‌نشده</button><button class="filter" data-filter="groups">گروه‌ها</button><button class="filter" data-filter="channels">کانال‌ها</button></div>
 <div class="stories" id="stories"></div>
 <div class="chats" id="chatList"></div>
</aside>
<main class="main" id="main">
 <div class="empty" id="emptyState"><div class="emptycard"><div class="plane">✈️</div><h2>به ایرانگرام خوش آمدی</h2><p>یک گفت‌وگو را انتخاب کن یا گفت‌وگوی تازه بساز.<br>نسخه نمایشی پیشرفته با طراحی مناسب گوشی.</p><button class="primary" id="startChat">شروع گفت‌وگو</button><p class="subtle">این نسخه به‌تنهایی پیام‌ها را به دستگاه‌های دیگر ارسال نمی‌کند.</p></div></div>
 <section class="chatview" id="chatView" style="display:none">
  <header class="chatheader"><button class="iconbtn backbtn" id="backBtn" style="color:var(--text)">‹</button><div class="avatar" id="headAvatar">ای</div><div class="chatname"><b id="headName">گفت‌وگو</b><small id="headStatus">نمایشی</small></div><button class="iconbtn" id="chatSearchBtn" style="color:var(--text)" title="جست‌وجوی پیام">⌕</button><button class="iconbtn" id="chatMoreBtn" style="color:var(--text)" title="گزینه‌ها">⋮</button></header>
  <div class="messages" id="messages"></div>
  <div class="composer"><button class="round" id="emojiBtn" title="ایموجی">☺</button><div class="composefield"><button class="iconbtn" id="attachBtn" style="color:var(--muted)" title="پیوست">＋</button><textarea id="messageInput" rows="1" placeholder="پیام بنویس..."></textarea></div><button class="send" id="sendBtn" title="ارسال">➤</button><input type="file" id="fileInput" hidden multiple></div>
 </section>
</main>
</div>
<div class="modalback" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL = 'https://gqitvlgdcrbwejaadorc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2NkURiHcD4ceRzqXUNsYlQ_jZzsVbhf';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
const starter=()=>[
{id:'official',name:'کانال رسمی ایرانگرام',type:'channels',avatar:'ای',color:'gold',status:'کانال رسمی',unread:0,messages:[{id:uid(),text:'به کانال رسمی ایرانگرام خوش آمدید 💙\\nاین نسخه نمایشی است. قابلیت‌های آنلاین پس از اتصال سرور فعال می‌شوند.',mine:false,time:'۱۲:۰۰',reactions:[]}]},
{id:'nilo',name:'نیلوفر',type:'people',avatar:'ن',color:'purple',status:'آخرین بازدید اخیراً',unread:1,messages:[{id:uid(),text:'سلام! به ایرانگرام خوش اومدی 😊',mine:false,time:'۱۱:۴۵',reactions:[]}]},
{id:'friends',name:'گروه دوستان',type:'groups',avatar:'👥',color:'green',status:'گروه نمایشی',unread:0,messages:[{id:uid(),text:'اینجا می‌تونی گفت‌وگوی گروهی رو امتحان کنی.',mine:false,time:'دیروز',reactions:[]}]},
{id:'news',name:'خبرهای ایرانگرام',type:'channels',avatar:'📣',color:'',status:'کانال نمایشی',unread:0,messages:[{id:uid(),text:'خبرها و اطلاعیه‌های آزمایشی در این بخش قرار می‌گیرند.',mine:false,time:'دیروز',reactions:[]}]},
{id:'saved',name:'پیام‌های ذخیره‌شده',type:'people',avatar:'★',color:'gold',status:'فضای شخصی روی این دستگاه',unread:0,messages:[{id:uid(),text:'پیام‌ها یا یادداشت‌های مهمت را اینجا نگه دار.',mine:false,time:'',reactions:[]}]}
];
let state={profile:{name:'کاربر ایرانگرام',bio:'سلام! من در ایرانگرام هستم.',theme:'light'},chats:starter(),active:null,filter:'all',query:'',reply:null};
try{const s=JSON.parse(localStorage.getItem('iranGramPro'));if(s&&s.chats&&s.profile)state={...state,...s}}catch(e){}
function save(){try{localStorage.setItem('iranGramPro',JSON.stringify(state))}catch(e){}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}
function activeChat(){return state.chats.find(c=>c.id===state.active)}
function renderStories(){const items=[['＋','داستان من','add'],['ن','نیلوفر',''],['ا','آرمان',''],['گ','گروه دوستان',''],['ای','ایرانگرام','']];$('#stories').innerHTML=items.map((x,i)=>`<div class="story" data-story="${i}"><div class="storyring ${x[2]}"><span>${x[0]}</span></div>${x[1]}</div>`).join('')}
function renderChats(){let arr=state.chats.filter(c=>(state.filter==='all'||(state.filter==='unread'?c.unread>0:c.type===state.filter))&&(`${c.name} ${c.messages.at(-1)?.text||''}`).toLowerCase().includes(state.query.toLowerCase()));$('#chatList').innerHTML=arr.map(c=>{let m=c.messages.at(-1)||{};return `<div class="chatrow ${state.active===c.id?'selected':''}" data-chat="${c.id}"><div class="avatar ${c.color||''}">${esc(c.avatar||c.name[0])}</div><div class="chatinfo"><div class="chathead"><b>${esc(c.name)}</b><span class="time">${esc(m.time||'')}</span></div><div class="preview">${c.type==='channels'?'📢 ':''}${esc(m.text||'هنوز پیامی نیست')}</div></div>${c.unread?`<span class="unread">${c.unread}</span>`:''}</div>`}).join('')||'<p class="subtle" style="padding:18px;text-align:center">گفت‌وگویی پیدا نشد.</p>'}
function renderMessages(){const c=activeChat();if(!c)return;$('#messages').innerHTML=`<div class="daylabel">امروز</div>`+c.messages.map(m=>`<article class="msg ${m.mine?'mine':''}" data-msg="${m.id}"><p>${esc(m.text)}</p><div class="msgmeta"><span>${esc(m.time||'')}</span>${m.mine?'<span>✓✓</span>':''}</div><div class="msgactions"><button class="tiny" data-react="${m.id}">♡ ${m.reactions?.length||''}</button>${m.mine?`<button class="tiny" data-edit="${m.id}">ویرایش</button><button class="tiny" data-delete="${m.id}">حذف</button>`:''}<button class="tiny" data-reply="${m.id}">پاسخ</button></div></article>`).join('');$('#messages').scrollTop=$('#messages').scrollHeight}
function openChat(id){const c=state.chats.find(c=>c.id===id);if(!c)return;state.active=id;c.unread=0;save();$('#emptyState').style.display='none';$('#chatView').style.display='flex';$('#app').classList.add('chat-open');$('#headAvatar').textContent=c.avatar||c.name[0];$('#headAvatar').className='avatar '+(c.color||'');$('#headName').textContent=c.name;$('#headStatus').textContent=c.status||'نمایشی';renderChats();renderMessages();$('#messageInput').focus()}
function render(){renderStories();renderChats();if(state.active&&activeChat()){openChatNoFocus()}if(state.profile.theme==='dark')document.body.classList.add('dark');else document.body.classList.remove('dark')}
function openChatNoFocus(){const c=activeChat();$('#emptyState').style.display='none';$('#chatView').style.display='flex';$('#headAvatar').textContent=c.avatar||c.name[0];$('#headAvatar').className='avatar '+(c.color||'');$('#headName').textContent=c.name;$('#headStatus').textContent=c.status||'نمایشی';renderMessages()}

let currentUser=null, realtimeChannel=null, remoteMode=false;
function authModal(){
 showModal('ورود به ایرانگرام',`<p class="subtle">برای استفاده از حساب آنلاین، با ایمیل و رمز عبور وارد شو یا حساب بساز.</p><label>ایمیل</label><input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com"><label>رمز عبور</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="حداقل ۶ کاراکتر"><div class="modalactions"><button class="secondary" id="signUpBtn">ساخت حساب</button><button class="primary" id="signInBtn">ورود</button></div><p class="subtle" id="authHint" role="status"></p>`);
 $('#signInBtn').onclick=async()=>{const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password){$('#authHint').textContent='ایمیل و رمز عبور را وارد کن.';return}const {error}=await supabaseClient.auth.signInWithPassword({email,password});$('#authHint').textContent=error?error.message:'ورود انجام شد.';if(!error){closeModal();await startOnline()}};
 $('#signUpBtn').onclick=async()=>{const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||password.length<6){$('#authHint').textContent='ایمیل معتبر و رمز حداقل ۶ کاراکتری وارد کن.';return}const {data,error}=await supabaseClient.auth.signUp({email,password});$('#authHint').textContent=error?error.message:(data.session?'حساب ساخته شد.':'حساب ساخته شد؛ ایمیلت را برای تأیید بررسی کن.');if(data.session){closeModal();await startOnline()}};
}
async function loadOnlineChats(){
 const {data,error}=await supabaseClient.from('conversation_members').select('conversation_id,role,conversations(id,title,type,created_at,messages(id,body,sender_id,created_at))');
 if(error){toast('گرفتن گفتگوها ناموفق بود: '+error.message);return}
 state.chats=(data||[]).filter(x=>x.conversations).map(x=>{const c=x.conversations;return {id:c.id,name:c.title||'گفت‌وگو',type:c.type==='channel'?'channels':(c.type==='group'?'groups':'people'),avatar:c.type==='channel'?'📢':(c.type==='group'?'👥':(c.title||'گ')[0]),status:'گفت‌وگوی آنلاین',unread:0,remote:true,messages:(c.messages||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(m=>({id:m.id,text:m.body,mine:m.sender_id===currentUser.id,time:new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),reactions:[]}))}});
 if(!state.chats.some(c=>c.id===state.active))state.active=null;
 renderChats();
 if(state.active)openChatNoFocus();else{$('#chatView').style.display='none';$('#emptyState').style.display='grid'}
}
async function startOnline(){
 const {data,error}=await supabaseClient.auth.getUser();
 if(error||!data.user){authModal();return}
 currentUser=data.user;remoteMode=true;
 await loadOnlineChats();
 if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
 realtimeChannel=supabaseClient.channel('iran-gram-live-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{
   const m=payload.new;const c=state.chats.find(x=>x.id===m.conversation_id);if(!c||m.sender_id===currentUser.id)return;
   c.messages.push({id:m.id,text:m.body,mine:false,time:new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),reactions:[]});
   if(state.active===c.id)renderMessages();renderChats();
 }).subscribe();
}
async function initAuth(){
 const {data}=await supabaseClient.auth.getSession();
 if(data.session){await startOnline()}else{authModal()}
 supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){currentUser=null;remoteMode=false;state.chats=[];state.active=null;authModal()}});
}

async function sendMessage(){const input=$('#messageInput'),text=input.value.trim();if(!text)return;let c=activeChat();if(!c){toast('اول یک گفت‌وگو انتخاب کن');return}if(remoteMode&&c.remote){const {error}=await supabaseClient.from('messages').insert({conversation_id:c.id,sender_id:currentUser.id,body:text});if(error){toast('ارسال ناموفق بود: '+error.message);return}c.messages.push({id:uid(),text,mine:true,time:now(),reactions:[]});}else{toast('این گفتگو آنلاین نیست؛ پیام فقط روی همین دستگاه ذخیره می‌شود.');c.messages.push({id:uid(),text,mine:true,time:now(),reactions:[],reply:state.reply});}state.reply=null;input.value='';input.style.height='auto';save();renderChats();renderMessages()}
function newChat(){showModal('گفت‌وگوی تازه',`<label>نام مخاطب یا گفت‌وگو</label><input id="newName" placeholder="مثلاً سارا"><div class="modalactions"><button class="secondary" data-close>انصراف</button><button class="primary" id="createChat">ساخت گفت‌وگو</button></div>`);$('#createChat').onclick=()=>{const name=$('#newName').value.trim();if(!name){toast('یک نام وارد کن');return}const c={id:uid(),name,type:'people',avatar:name[0],status:'گفت‌وگوی نمایشی',unread:0,messages:[]};state.chats.unshift(c);save();closeModal();render();openChat(c.id)}}
function createCollection(type){const channel=type==='channels';showModal(channel?'ساخت کانال':'ساخت گروه',`<label>نام ${channel?'کانال':'گروه'}</label><input id="collectionName" placeholder="${channel?'مثلاً اطلاعیه‌های من':'مثلاً خانواده'}"><label>توضیحات</label><textarea id="collectionBio" placeholder="توضیح کوتاه (اختیاری)"></textarea><div class="modalactions"><button class="secondary" data-close>انصراف</button><button class="primary" id="createCollection">ساخت</button></div><p class="subtle">این ساختار در این نسخه فقط روی همین دستگاه ذخیره می‌شود.</p>`);$('#createCollection').onclick=()=>{const name=$('#collectionName').value.trim();if(!name){toast('نام را وارد کن');return}const c={id:uid(),name,type:channel?'channels':'groups',avatar:channel?'📢':'👥',color:channel?'gold':'green',status:channel?'کانال نمایشی':'گروه نمایشی',unread:0,messages:[{id:uid(),text:$('#collectionBio').value.trim()||`به ${name} خوش آمدید.`,mine:false,time:now(),reactions:[]}]};state.chats.unshift(c);save();closeModal();render();openChat(c.id)}}
function showModal(title,body){$('#modal').innerHTML=`<h3>${title}</h3>${body}`;$('#modalBack').classList.add('open')}
function closeModal(){$('#modalBack').classList.remove('open')}
function profileModal(){showModal('پروفایل من',`<label>نام نمایشی</label><input id="profileName" value="${esc(state.profile.name)}"><label>بیوگرافی</label><textarea id="profileBio">${esc(state.profile.bio)}</textarea><div class="modalactions"><button class="secondary" data-close>انصراف</button><button class="primary" id="saveProfile">ذخیره</button></div>`);$('#saveProfile').onclick=()=>{state.profile.name=$('#profileName').value.trim()||'کاربر ایرانگرام';state.profile.bio=$('#profileBio').value.trim();save();closeModal();toast('پروفایل روی این دستگاه ذخیره شد')}}
function settingsModal(){showModal('تنظیمات',`<p>ظاهر برنامه</p><button class="secondary" id="themeToggle" style="width:100%">تغییر حالت روشن / تیره</button><label>وضعیت</label><p class="subtle">این نسخه آزمایشی است. داده‌ها در حافظه مرورگر همین دستگاه ذخیره می‌شوند و با نصب روی دستگاه دیگر منتقل نمی‌شوند.</p><div class="modalactions"><button class="secondary" data-close>بستن</button><button class="primary" id="clearData">بازنشانی داده‌های نمایشی</button></div>`);$('#themeToggle').onclick=()=>{state.profile.theme=state.profile.theme==='dark'?'light':'dark';save();render();settingsModal()};$('#clearData').onclick=()=>{if(confirm('همه گفتگوهای نمایشی ذخیره‌شده روی این دستگاه پاک شوند؟')){state.chats=starter();state.active=null;state.profile={name:'کاربر ایرانگرام',bio:'سلام! من در ایرانگرام هستم.',theme:'light'};save();closeModal();$('#chatView').style.display='none';$('#emptyState').style.display='grid';$('#app').classList.remove('chat-open');render();toast('داده‌های نمایشی بازنشانی شد')}}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='iran-gram-backup.json';a.click();URL.revokeObjectURL(a.href);toast('فایل پشتیبان آماده شد')}
$('#menuBtn').onclick=()=>$('#mainMenu').classList.toggle('open');$('#newBtn').onclick=newChat;$('#startChat').onclick=newChat;$('#sendBtn').onclick=sendMessage;$('#messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('#messageInput').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});$('#backBtn').onclick=()=>$('#app').classList.remove('chat-open');$('#search').oninput=e=>{state.query=e.target.value;renderChats()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;renderChats()});
$('#mainMenu').onclick=e=>{const b=e.target.closest('button[data-action]');if(!b)return;$('#mainMenu').classList.remove('open');({profile:profileModal,group:()=>createCollection('groups'),channel:()=>createCollection('channels'),settings:settingsModal,export:exportData,about:()=>showModal('درباره ایرانگرام',`<p>ایرانگرام یک نمونه اولیه پیام‌رسان با رابط کاربری فارسی است.</p><p class="subtle">برای چت بین کاربران، ورود امن، آپلود واقعی فایل، استوری آنلاین، اعلان‌ها و نسخه اندروید، باید بک‌اند و سرویس‌های مربوطه پیاده‌سازی و متصل شوند.</p><div class="modalactions"><button class="primary" data-close>متوجه شدم</button></div>`)})[b.dataset.action]()};
$('#chatList').onclick=e=>{const row=e.target.closest('[data-chat]');if(row)openChat(row.dataset.chat)};
$('#messages').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=activeChat();if(!c)return;const id=b.dataset.react||b.dataset.edit||b.dataset.delete||b.dataset.reply;const m=c.messages.find(x=>x.id===id);if(!m)return;if(b.dataset.react!==undefined){m.reactions=m.reactions||[];m.reactions.push('♡');save();renderMessages()}else if(b.dataset.delete!==undefined){if(confirm('این پیام از همین دستگاه حذف شود؟')){c.messages=c.messages.filter(x=>x.id!==id);save();renderChats();renderMessages()}}else if(b.dataset.edit!==undefined){showModal('ویرایش پیام',`<textarea id="editText">${esc(m.text)}</textarea><div class="modalactions"><button class="secondary" data-close>انصراف</button><button class="primary" id="saveEdit">ذخیره</button></div>`);$('#saveEdit').onclick=()=>{m.text=$('#editText').value;save();closeModal();renderChats();renderMessages()}}else if(b.dataset.reply!==undefined){state.reply=id;$('#messageInput').placeholder='پاسخ به پیام انتخاب‌شده...';$('#messageInput').focus();toast('حالا پاسخ را بنویس و ارسال کن')}};
$('#stories').onclick=e=>{const el=e.target.closest('[data-story]');if(!el)return;if(el.dataset.story==='0'){showModal('داستان من',`<label>متن داستان</label><textarea id="storyText" placeholder="چه خبر؟"></textarea><div class="modalactions"><button class="secondary" data-close>انصراف</button><button class="primary" id="postStory">انتشار نمایشی</button></div><p class="subtle">داستان فقط به‌صورت آزمایشی روی همین دستگاه ثبت می‌شود.</p>`);$('#postStory').onclick=()=>{const t=$('#storyText').value.trim();closeModal();toast(t?'داستان نمایشی ثبت شد':'متنی وارد نکردی')}}else toast('استوری‌های این نسخه نمونه هستند و از کاربران واقعی دریافت نمی‌شوند')};
$('#emojiBtn').onclick=()=>{const input=$('#messageInput');input.value+=' 😊';input.focus()};$('#attachBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{const files=[...e.target.files];if(files.length)toast('فایل انتخاب شد: '+files.map(f=>f.name).join('، ')+' — ارسال واقعی فایل در این نسخه فعال نیست');e.target.value=''};
$('#chatSearchBtn').onclick=()=>{showModal('جست‌وجوی پیام',`<label>عبارت موردنظر</label><input id="msgSearch" placeholder="متن پیام"><div id="searchResults" class="subtle" style="margin-top:10px"></div><div class="modalactions"><button class="secondary" data-close>بستن</button><button class="primary" id="doSearch">جست‌وجو</button></div>`);$('#doSearch').onclick=()=>{const q=$('#msgSearch').value.toLowerCase();const hits=activeChat().messages.filter(m=>m.text.toLowerCase().includes(q));$('#searchResults').innerHTML=hits.length?hits.map(m=>`<p>• ${esc(m.text)}</p>`).join(''):'چیزی پیدا نشد.'}};
$('#chatMoreBtn').onclick=()=>showModal('گزینه‌های گفت‌وگو',`<button class="secondary" id="clearChat" style="width:100%">پاک‌کردن پیام‌های این گفت‌وگو</button><p class="subtle">این کار فقط داده‌های محلی همین دستگاه را تغییر می‌دهد.</p><div class="modalactions"><button class="primary" data-close>بستن</button></div>`);$('#modal').addEventListener('click',e=>{if(e.target.matches('[data-close]'))closeModal();if(e.target.id==='clearChat'){if(confirm('پیام‌های این گفت‌وگو پاک شوند؟')){activeChat().messages=[];save();closeModal();renderMessages();renderChats()}}});$('#modalBack').onclick=e=>{if(e.target===$('#modalBack'))closeModal()};
if(!window.supabase){toast('بارگذاری سرویس ورود ناموفق بود. صفحه را تازه‌سازی کن.')}else{initAuth()}
</script>
</body>
</html>
