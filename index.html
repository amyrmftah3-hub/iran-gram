avatar{width:43px;height:43px}.chatname{flex:1;min-width:0}.chatname b{display:block;font-size:14px}.verified{display:inline-grid;place-items:center;width:16px;height:16px;margin-right:5px;border-radius:50%;background:#168acd;color:#fff;font-size:11px;font-weight:bold;vertical-align:middle}.folder-empty{padding:30px 18px;text-align:center;color:var(--muted)}.folder-icon{font-size:46px;display:inline-block;animation:folderFloat 2.4s ease-in-out infinite}.folder-empty b{display:block;color:var(--text);margin:10px 0 5px}.folder-empty p{font-size:12px;line-height:1.8;margin:0}.animated-sticker{display:inline-block;font-size:48px;line-height:1.25;animation:stickerBounce 1.15s ease-in-out infinite;transform-origin:50% 80%}.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sticker-option{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:82px}.sticker-option .animated-sticker{font-size:42px}@keyframes folderFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}@keyframes stickerBounce{0%,100%{transform:translateY(0) rotate(-5deg) scale(1)}30%{transform:translateY(-8px) rotate(7deg) scale(1.08)}60%{transform:translateY(1px) rotate(-3deg) scale(.98)}}.chatname small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.messages{flex:1;overflow:auto;padding:18px max(14px,5%);display:flex;flex-direction:column;gap:9px;background-color:#dcecf4;background-image:radial-gradient(#ffffff55 1px,transparent 1px);background-size:22px 22px}.daylabel{align-self:center;background:#7895a450;color:#355667;padding:5px 12px;border-radius:12px;font-size:11px;margin-bottom:5px}.msg{max-width:min(78%,520px);padding:9px 11px 6px;border-radius:14px;background:var(--bubble);box-shadow:0 1px 2px #17354812;align-self:flex-start;overflow-wrap:anywhere;position:relative}.msg.mine{align-self:flex-end;background:var(--mine);border-bottom-right-radius:4px}.msg:not(.mine){border-bottom-left-radius:4px}.msg p{margin:0;white-space:pre-wrap;font-size:14px;line-height:1.65}.msgmeta{display:flex;justify-content:flex-end;align-items:center;gap:6px;color:#72828c;font-size:10px;margin-top:4px}.msgactions{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}.tiny{background:#ffffff80;color:#60727e;border-radius:10px;font-size:11px;padding:3px 6px}.composer{display:flex;align-items:flex-end;gap:8px;padding:10px;background:#f6f8f9;border-top:1px solid var(--line)}.composefield{flex:1;display:flex;align-items:flex-end;gap:8px;background:#fff;border:1px solid #e4eaee;border-radius:24px;padding:6px 10px;min-width:0}.composefield textarea{resize:none;max-height:120px;min-height:34px;flex:1;border:0;outline:none;padding:8px 0;background:transparent;line-height:1.5}.send{background:var(--blue);color:white;width:43px;height:43px;border-radius:50%;font-size:19px;flex-shrink:0}.send:hover{background:var(--blue2)}.round{width:42px;height:42px;border-radius:50%;background:#fff;color:#5c7380;font-size:20px;flex-shrink:0}.welcome{display:none}.modalback{position:fixed;inset:0;background:#0b1c2b80;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modalback.open{display:flex}.modal{background:var(--panel);border-radius:18px;padding:20px;width:min(440px,100%);max-height:90dvh;overflow:auto;box-shadow:0 15px 50px #0003}.modal h3{margin:0 0 16px}.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}.modal input,.modal textarea,.modal select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text)}.modal textarea{min-height:80px;resize:vertical}.modalactions{display:flex;gap:8px;margin-top:16px}.primary{background:var(--blue);color:#fff;padding:11px 16px;border-radius:10px;flex:1}.secondary{background:#eef3f6;color:var(--text);padding:11px 16px;border-radius:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17212b;color:white;padding:11px 18px;border-radius:20px;font-size:12px;display:none;z-index:10;max-width:90%;text-align:center}.toast.show{display:block}.menu{position:absolute;top:60px;left:12px;background:var(--panel);border-radius:12px;box-shadow:0 8px 28px #0002;padding:6px;z-index:3;display:none;min-width:180px}.menu.open{display:block}.menu button{display:block;width:100%;text-align:right;background:transparent;color:var(--text);padding:12px;border-radius:8px;font-size:13px}.menu button:hover{background:#edf5fa}.subtle{font-size:11px;color:var(--muted);line-height:1.8}.dark{--bg:#0e1720;--panel:#17212b;--text:#e8eef3;--muted:#9aabb8;--line:#2b3945;--chat:#0d1c27;--bubble:#202e3a;--mine:#214b43;--shadow:0 5px 24px #0002}.dark .searchbox input{background:#263441;color:var(--text)}.dark .filter.active{background:#203b4d}.dark .chatrow:hover,.dark .chatrow.selected{background:#20313f}.dark .composer{background:#17212b}.dark .composefield,.dark .round{background:#202e3a;color:var(--text);border-color:#34434f}.dark .messages{background-color:#0d1c27}.dark .emptycard{background:#17212be0}.dark .secondary{background:#263441;color:var(--text)}.dark .storyring span{background:#203441;border-color:#17212b}.dark .storyring.add span{background:#202e3a}.dark .tiny{background:#20313f;color:#c4d0d8}

 <div class="empty" id="emptyState"><div class="emptycard"><div class="plane">✈️</div><h2>به آریوگرام خوش آمدی</h2><p>یک گفت‌وگو را انتخاب کن یا گفت‌وگوی تازه بساز.<br>نسخه نمایشی پیشرفته با طراحی مناسب گوشی.</p><button class="primary" id="startChat">شروع گفت‌وگو</button><p class="subtle">این نسخه به‌تنهایی پیام‌ها را به دستگاه‌های دیگر ارسال نمی‌کند.</p></div></div>

<script>
const SUPABASE_URL = 'https://gqitvlgdcrbwejaadorc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2NkURiHcD4ceRzqXUNsYlQ_jZzsVbhf';

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);

const starter=()=>[
{id:'official',name:'کانال رسمی آریوگرام',type:'channels',avatar:'ای',color:'gold',status:'کانال رسمی',unread:0,messages:[{id:uid(),text:'به کانال رسمی آریوگرام خوش آمدید 💙\\nاین نسخه نمایشی است. قابلیت‌های آنلاین پس از اتصال سرور فعال می‌شوند.',mine:false,time:'۱۲:۰۰',reactions:[]}]},
{id:'nilo',name:'نیلوفر',type:'people',avatar:'ن',color:'purple',status:'آخرین بازدید اخیراً',unread:1,messages:[{id:uid(),text:'سلام! به آریوگرام خوش اومدی 😊',mine:false,time:'۱۱:۴۵',reactions:[]}]},
{id:'friends',name:'گروه دوستان',type:'groups',avatar:'👥',color:'green',status:'گروه نمایشی',unread:0,messages:[{id:uid(),text:'اینجا می‌تونی گفت‌وگوی گروهی رو امتحان کنی.',mine:false,time:'دیروز',reactions:[]}]},
{id:'news',name:'خبرهای آریوگرام',type:'channels',avatar:'📣',color:'',status:'کانال نمایشی',unread:0,messages:[{id:uid(),text:'خبرها و اطلاعیه‌های آزمایشی در این بخش قرار می‌گیرند.',mine:false,time:'دیروز',reactions:[]}]},
{id:'saved',name:'پیام‌های ذخیره‌شده',type:'people',avatar:'★',color:'gold',status:'فضای شخصی روی این دستگاه',unread:0,messages:[{id:uid(),text:'پیام‌ها یا یادداشت‌های مهمت را اینجا نگه دار.',mine:false,time:'',reactions:[]}]}
];
let state={profile:{name:'کاربر آریوگرام',bio:'سلام! من در آریوگرام هستم.',theme:'light'},chats:starter(),active:null,filter:'all',query:'',reply:null};
try{const s=JSON.parse(localStorage.getItem('iranGramPro'));if(s&&s.chats&&s.profile)state={...state,...s}}catch(e){}
function save(){try{localStorage.setItem('iranGramPro',JSON.stringify(state))}catch(e){}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}
function activeChat(){return state.chats.find(c=>c.id===state.active)}
function renderStories(){const items=[['＋','داستان من','add'],['ن','نیلوفر',''],['ا','آرمان',''],['گ','گروه دوستان',''],['ای','آریوگرام','']];$('#stories').innerHTML=items.map((x,i)=>`<div class="story" data-story="${i}"><div class="storyring ${x[2]}"><span>${x[0]}</span></div>${x[1]}</div>`).join('')}
function renderChats(){let arr=state.chats.filter(c=>{const inFolder=state.filter==='all'?!c.archived&&!c.hidden:state.filter==='archive'?!!c.archived:state.filter==='hidden'?!!c.hidden:state.filter==='unread'?c.unread>0:c.type===state.filter;return inFolder&&(`${c.name} ${c.messages.at(-1)?.text||''}`).toLowerCase().includes(state.query.toLowerCase())});const empty=state.filter==='archive'?'<div class="folder-empty"><span class="folder-icon">📂</span><b>آرشیو هنوز خالیه</b><p>گفت‌وگوها را به بالا بکش تا اینجا نگه‌شان داری.</p></div>':state.filter==='hidden'?'<div class="folder-empty"><span class="folder-icon">🗂️</span><b>پوشه مخفی خالیه</b><p>گفت‌وگوهای مخفی‌شده با کشیدن به پایین اینجا می‌آیند.</p></div>':'<div class="folder-empty"><span class="folder-icon">✈️</span><b>گفت‌وگویی پیدا نشد</b><p>یک گفت‌وگوی تازه بساز و شروع کن.</p></div>';$('#chatList').innerHTML=arr.map(c=>{let m=c.messages.at(-1)||{};return `<div class="chatrow ${state.active===c.id?'selected':''}" data-chat="${c.id}"><div class="avatar ${c.color||''}">${esc(c.avatar||c.name[0])}</div><div class="chatinfo"><div class="chathead"><b>${esc(c.name)}${c.verified?' <span class="verified" title="تأییدشده">✓</span>':''}</b><span class="time">${esc(m.time||'')}</span></div><div class="preview">${c.type==='channels'?'📢 ':''}${esc(m.text||'هنوز پیامی نیست')}</div></div>${c.unread?`<span class="unread">${c.unread}</span>`:''}</div>`}).join('')||empty}
function renderMessageContent(value){const match=String(value||'').match(/^\[\[sticker:(.+)\]\]$/);if(match){const emoji=match[1];return '<span class="animated-sticker" role="img" aria-label="استیکر">'+esc(emoji)+'</span>'}return esc(value)}
function renderMessages(){const c=activeChat();if(!c)return;$('#messages').innerHTML=`<div class="daylabel">امروز</div>`+c.messages.map(m=>`<article class="msg ${m.mine?'mine':''}" data-msg="${m.id}"><p>${renderMessageContent(m.text)}</p><div class="msgmeta"><span>${esc(m.time||'')}</span>${m.mine?'<span>✓✓</span>':''}</div><div class="msgactions"><button class="tiny" data-react="${m.id}">♡ ${m.reactions?.length||''}</button>${m.mine?`<button class="tiny" data-edit="${m.id}">ویرایش</button><button class="tiny" data-delete="${m.id}">حذف</button>`:''}<button class="tiny" data-reply="${m.id}">پاسخ</button></div></article>`).join('');$('#messages').scrollTop=$('#messages').scrollHeight}
function openChat(id){const c=state.chats.find(c=>c.id===id);if(!c)return;state.active=id;c.unread=0;if(remoteMode&&c.remote&&c.type==='channels')recordChannelActivity(c.id);save();$('#emptyState').style.display='none';$('#chatView').style.display='flex';$('#app').classList.add('chat-open');$('#headAvatar').textContent=c.avatar||c.name[0];$('#headAvatar').className='avatar '+(c.color||'');$('#headName').innerHTML=esc(c.name)+(c.verified?' <span class="verified" title="تأییدشده">✓</span>':'');$('#headStatus').textContent=c.status||'نمایشی';renderChats();renderMessages();$('#messageInput').focus()}
function render(){renderStories();renderChats();if(state.active&&activeChat()){openChatNoFocus()}if(state.profile.theme==='dark')document.body.classList.add('dark');else document.body.classList.remove('dark')}
function openChatNoFocus(){const c=activeChat();$('#emptyState').style.display='none';$('#chatView').style.display='flex';$('#headAvatar').textContent=c.avatar||c.name[0];$('#headAvatar').className='avatar '+(c.color||'');$('#headName').textContent=c.name;$('#headStatus').textContent=c.status||'نمایشی';renderMessages()}

let currentUser=null, realtimeChannel=null, remoteMode=false, activityHeartbeat=null;
function authModal(){
 showModal('ورود به آریوگرام',`<p class="subtle">برای استفاده از حساب آنلاین، با ایمیل و رمز عبور وارد شو یا حساب بساز.</p><label>ایمیل</label><input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com"><label>رمز عبور</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="حداقل ۶ کاراکتر"><div class="modalactions"><button class="secondary" id="signUpBtn">ساخت حساب</button><button class="primary" id="signInBtn">ورود</button></div><p class="subtle" id="authHint" role="status"></p>`);
 $('#signInBtn').onclick=async()=>{const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password){$('#authHint').textContent='ایمیل و رمز عبور را وارد کن.';return}const {error}=await supabaseClient.auth.signInWithPassword({email,password});$('#authHint').textContent=error?error.message:'ورود انجام شد.';if(!error){closeModal();await startOnline()}};
 $('#signUpBtn').onclick=async()=>{const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||password.length<6){$('#authHint').textContent='ایمیل معتبر و رمز حداقل ۶ کاراکتری وارد کن.';return}const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{name:email.split('@')[0]}}});$('#authHint').textContent=error?error.message:(data.session?'حساب ساخته شد.':'حساب ساخته شد؛ ایمیلت را برای تأیید بررسی کن.');if(data.session){closeModal();await startOnline()}};

async function loadOnlineChats(){
 const {data,error}=await supabaseClient.from('conversation_members').select('conversation_id,role,conversations(id,title,type,created_at,messages(id,body,sender_id,created_at))');
 if(error){toast('گرفتن گفتگوها ناموفق بود: '+error.message);return}
 const localFlags=new Map(state.chats.map(c=>[c.id,{archived:!!c.archived,hidden:!!c.hidden}]));
 state.chats=(data||[]).filter(x=>x.conversations).map(x=>{const c=x.conversations,flags=localFlags.get(c.id)||{};return {id:c.id,name:c.title||'گفت‌وگو',type:c.type==='channel'?'channels':(c.type==='group'?'groups':'people'),avatar:c.type==='channel'?'📢':(c.type==='group'?'👥':(c.title||'گ')[0]),status:'گفت‌وگوی آنلاین',unread:0,remote:true,archived:flags.archived,hidden:flags.hidden,messages:(c.messages||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(m=>({id:m.id,text:m.body,mine:m.sender_id===currentUser.id,time:new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),reactions:[]}))}});
 const ids=state.chats.map(c=>c.id);
 if(ids.length){
  const {data:members}=await supabaseClient.from('conversation_members').select('conversation_id,user_id').in('conversation_id',ids);
  const {data:channelStatus,error:statusError}=await supabaseClient.rpc('get_channel_verification_status');if(statusError)console.warn('Channel verification status unavailable',statusError.message);
  const {data:verifiedUsers}=await supabaseClient.from('user_verification_overrides').select('user_id').eq('is_verified',true);
  const verifiedSet=new Set((verifiedUsers||[]).map(x=>x.user_id));
  const statusMap=new Map((channelStatus||[]).map(x=>[x.channel_id,x]));
  for(const c of state.chats){
   const st=statusMap.get(c.id);if(st){c.verified=st.is_verified;c.active_users_30d=st.active_users_30d}
   if(c.type==='people'){const peer=(members||[]).find(m=>m.conversation_id===c.id&&m.user_id!==currentUser.id);if(peer){c.recipientUserId=peer.user_id;c.verified=verifiedSet.has(peer.user_id)}}
  }
 }
 if(!state.chats.some(c=>c.id===state.active))state.active=null;
 renderChats();
 if(state.active)openChatNoFocus();else{$('#chatView').style.display='none';$('#emptyState').style.display='grid'}
}
async function recordChannelActivity(channelId){if(!remoteMode||!currentUser||!channelId)return;const {error}=await supabaseClient.rpc('record_channel_activity',{p_channel_id:channelId});if(error){console.warn('Channel activity update failed',error.message);return}const {data}=await supabaseClient.rpc('get_channel_verification_status');const status=(data||[]).find(x=>x.channel_id===channelId),c=state.chats.find(x=>x.id===channelId);if(status&&c){c.verified=status.is_verified;c.active_users_30d=status.active_users_30d;renderChats()}}
async function startOnline(){
 const {data,error}=await supabaseClient.auth.getUser();
 if(error||!data.user){authModal();return}
 currentUser=data.user;remoteMode=true;
 await loadOnlineChats();
 if(activityHeartbeat)clearInterval(activityHeartbeat);
 activityHeartbeat=setInterval(()=>{const c=activeChat();if(c&&c.remote&&c.type==='channels')recordChannelActivity(c.id)},10*60*1000);
 if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
 realtimeChannel=supabaseClient.channel('iran-gram-live-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{
   const m=payload.new;const c=state.chats.find(x=>x.id===m.conversation_id);if(!c||m.sender_id===currentUser.id)return;
   c.messages.push({id:m.id,text:m.body,mine:false,time:new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),reactions:[]});
   if(state.active===c.id)renderMessages();renderChats();
 }).subscribe();
}
async function initAuth(){
 const {data}=await supabaseClient.auth.getSession();
 if(data.session){await startOnline()}else{authModal()}
 supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){currentUser=null;remoteMode=false;state.chats=[];state.active=null;authModal()}});
}

async function sendMessage(){const input=$('#messageInput'),text=input.value.trim();if(!text)return;let c=activeChat();if(!c){toast('اول یک گفت‌وگو انتخاب کن');return}if(remoteMode&&c.remote){const {error}=await supabaseClient.from('messages').insert({conversation_id:c.id,sender_id:currentUser.id,body:text});if(error){toast('ارسال ناموفق بود: '+error.message);return}c.messages.push({id:uid(),text,mine:true,time:now(),reactions:[]});}else{toast('این گفتگو آنلاین نیست؛ پیام فقط روی همین دستگاه ذخیره می‌شود.');c.messages.push({id:uid(),text,mine:true,time:now(),reactions:[],reply:state.reply});}state.reply=null;input.value='';input.style.height='auto';save();renderChats();renderMessages()}
function newChat(){showModal('گفت‌وگوی تازه',`<label>نام نمایشی دقیق مخاطب</label><input id="newName" placeholder="مثلاً سارا"><div class="modalactions"><button class="secondary" data-close>انصراف</button><button class="primary" id="createChat">ساخت گفت‌وگو</button></div><p class="subtle">برای گفت‌وگوی آنلاین، مخاطب باید قبلاً حساب ساخته و نام نمایشی خود را ثبت کرده باشد.</p>`);$('#createChat').onclick=async()=>{const name=$('#newName').value.trim();if(!name){toast('یک نام وارد کن');return}if(remoteMode&&currentUser){const {data:users,error:findError}=await supabaseClient.from('profiles').select('id,display_name').ilike('display_name',name).neq('id',currentUser.id).limit(2);if(findError){toast('جست‌وجوی مخاطب ناموفق بود: '+findError.message);return}if(!users||users.length!==1){toast(users&&users.length>1?'چند نفر این نام را دارند؛ نام دقیق‌تری لازم است.':'کاربری با این نام پیدا نشد.');return}const {data:conv,error:convError}=await supabaseClient.from('conversations').insert({title:name,type:'private',created_by:currentUser.id}).select('id').single();if(convError){toast('ساخت گفتگو ناموفق بود: '+convError.message);return}const {error:ownerError}=await supabaseClient.from('conversation_members').insert({conversation_id:conv.id,user_id:currentUser.id,role:'owner'});if(ownerError){toast('ثبت مالک گفتگو ناموفق بود: '+ownerError.message);return}const {error:memberError}=await supabaseClient.from('conversation_members').insert({conversation_id:conv.id,user_id:users[0].id,role:'member'});if(memberError){toast('افزودن مخاطب ناموفق بود: '+memberError.message);return}closeModal();await loadOnlineChats();openChat(conv.id);return}const c={id:uid(),name,type:'people',avatar:name[0],status:'گفت‌وگوی نمایشی',unread:0,messages:[]};state.chats.unshift(c);save();closeModal();render();openChat(c.id)}}
function createCollection(type){const channel=type==='channels';showModal(channel?'ساخت کانال':'ساخت گروه',`<label>نام ${channel?'کانال':'گروه'}</label><input id="collectionName" placeholder="${channel?'مثلاً اطلاعیه‌های من':'مثلاً خانواده'}"><label>توضیحات</label><textarea id="collectionBio" placeholder="توضیح کوتاه (اختیاری)"></textarea><div class="modalactions"><button class="secondary" data-close>انصراف</button><button class="primary" id="createCollection">ساخت</button></div><p class="subtle">در حالت آنلاین، کانال و گروه در سرور ساخته می‌شوند.</p>`);$('#createCollection').onclick=async()=>{const name=$('#collectionName').value.trim(),bio=$('#collectionBio').value.trim();if(!name){toast('نام را وارد کن');return}if(remoteMode&&currentUser){const kind=channel?'channel':'group';const {data:conv,error}=await supabaseClient.from('conversations').insert({title:name,type:kind,created_by:currentUser.id}).select('id').single();if(error){toast('ساخت ناموفق بود: '+error.message);return}const {error:memberError}=await supabaseClient.from('conversation_members').insert({conversation_id:conv.id,user_id:currentUser.id,role:'owner'});if(memberError){toast('ساخت عضویت ناموفق بود: '+memberError.message);return}if(bio){const {error:msgError}=await supabaseClient.from('messages').insert({conversation_id:conv.id,sender_id:currentUser.id,body:bio});if(msgError){toast('کانال ساخته شد، اما توضیحات ثبت نشد.')}}closeModal();await loadOnlineChats();openChat(conv.id);return}const c={id:uid(),name,type:channel?'channels':'groups',avatar:channel?'📢':'👥',color:channel?'gold':'green',status:channel?'کانال نمایشی':'گروه نمایشی',unread:0,messages:[{id:uid(),text:bio||`به ${name} خوش آمدید.`,mine:false,time:now(),reactions:[]}]};state.chats.unshift(c);save();closeModal();render();openChat(c.id)}}

$('#chatList').addEventListener('touchstart',e=>{suppressChatClick=false;const row=e.target.closest('[data-chat]');if(row)chatTouchStart={id:row.dataset.chat,y:e.changedTouches[0].clientY}},{passive:true});
$('#chatList').addEventListener('touchend',e=>{if(!chatTouchStart)return;const dy=e.changedTouches[0].clientY-chatTouchStart.y;const c=state.chats.find(x=>x.id===chatTouchStart.id);chatTouchStart=null;if(!c)return;if(dy < -75){suppressChatClick=true;c.archived=true;c.hidden=false;save();renderChats();toast('گفت‌وگو به آرشیو رفت')}else if(dy > 75){suppressChatClick=true;c.hidden=true;c.archived=false;save();renderChats();toast('گفت‌وگو مخفی شد')}},{passive:true});
$('#messages').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=activeChat();if(!c)return;const id=b.dataset.react||b.dataset.edit||b.dataset.delete||b.dataset.reply;const m=c.messages.find(x=>x.id===id);if(!m)return;if(b.dataset.react!==undefined){m.reactions=m.reactions||[];m.reactions.push('♡');save();renderMessages()}else if(b.dataset.delete!==undefined){if(confirm('این پیام از همین دستگاه حذف شود؟')){c.messages=c.messages.filter(x=>x.id!==id);save();renderChats();renderMessages()}}else if(b.dataset.edit!==undefined){showModal('ویرایش پیام',`<textarea id="editText">${esc(m.text)}</textarea><div class="modalactions"><button class="secondary" data-close>انصراف</button><button class="primary" id="saveEdit">ذخیره</button></div>`);$('#saveEdit').onclick=()=>{m.text=$('#editText').value;save();closeModal();renderChats();renderMessages()}}else if(b.dataset.reply!==undefined){state.reply=id;$('#messageInput').placeholder='پاسخ به پیام انتخاب‌شده...';$('#messageInput').focus();toast('حالا پاسخ را بنویس و ارسال کن')}};
$('#stories').onclick=e=>{const el=e.target.closest('[data-story]');if(!el)return;if(el.dataset.story==='0'){showModal('داستان من',`<label>متن داستان</label><textarea id="storyText" placeholder="چه خبر؟"></textarea><div class="modalactions"><button class="secondary" data-close>انصراف</button><button class="primary" id="postStory">انتشار نمایشی</button></div><p class="subtle">داستان فقط به‌صورت آزمایشی روی همین دستگاه ثبت می‌شود.</p>`);$('#postStory').onclick=()=>{const t=$('#storyText').value.trim();closeModal();toast(t?'داستان نمایشی ثبت شد':'متنی وارد نکردی')}}else toast('استوری‌های این نسخه نمونه هستند و از کاربران واقعی دریافت نمی‌شوند')};
$('#emojiBtn').onclick=()=>{const input=$('#messageInput');input.value+=' 😊';input.focus()};$('#stickerBtn').onclick=stickerModal;$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-sticker]');if(b)sendSticker(b.dataset.sticker)});$('#attachBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{const files=[...e.target.files];if(files.length)toast('فایل انتخاب شد: '+files.map(f=>f.name).join('، ')+' — ارسال واقعی فایل در این نسخه فعال نیست');e.target.value=''};
$('#chatSearchBtn').onclick=()=>{showModal('جست‌وجوی پیام',`<label>عبارت موردنظر</label><input id="msgSearch" placeholder="متن پیام"><div id="searchResults" class="subtle" style="margin-top:10px"></div><div class="modalactions"><button class="secondary" data-close>بستن</button><button class="primary" id="doSearch">جست‌وجو</button></div>`);$('#doSearch').onclick=()=>{const q=$('#msgSearch').value.toLowerCase();const hits=activeChat().messages.filter(m=>m.text.toLowerCase().includes(q));$('#searchResults').innerHTML=hits.length?hits.map(m=>`<p>• ${esc(m.text)}</p>`).join(''):'چیزی پیدا نشد.'}};
$('#chatMoreBtn').onclick=()=>{const c=activeChat();if(!c)return;showModal('گزینه‌های گفت‌وگو',`<button class="secondary" id="clearChat" style="width:100%;margin-bottom:8px">پاک‌کردن پیام‌های این گفت‌وگو</button><button class="secondary" id="archiveChat" style="width:100%;margin-bottom:8px">${c.archived?'بازگرداندن از آرشیو':'انتقال به آرشیو'}</button><button class="secondary" id="hideChat" style="width:100%;margin-bottom:8px">${c.hidden?'نمایش دوباره گفت‌وگو':'مخفی‌کردن گفت‌وگو'}</button><p class="subtle">کشیدن گفت‌وگو به بالا: آرشیو | کشیدن به پایین: مخفی‌کردن</p><div class="modalactions"><button class="primary" data-close>بستن</button></div>`)};$('#modal').addEventListener('click',e=>{if(e.target.matches('[data-close]'))closeModal();if(e.target.id==='clearChat'){if(confirm('پیام‌های این گفت‌وگو پاک شوند؟')){activeChat().messages=[];save();closeModal();renderMessages();renderChats()}}if(e.target.id==='archiveChat'){const c=activeChat();c.archived=!c.archived;if(c.archived)c.hidden=false;save();closeModal();renderChats()}if(e.target.id==='hideChat'){const c=activeChat();c.hidden=!c.hidden;if(c.hidden)c.archived=false;save();closeModal();renderChats()}});$('#modalBack').onclick=e=>{if(e.target===$('#modalBack'))closeModal()};
if(!window.supabase){toast('بارگذاری سرویس ورود ناموفق بود. صفحه را تازه‌سازی کن.')}else{initAuth()}
</script>
</body>
</html>
